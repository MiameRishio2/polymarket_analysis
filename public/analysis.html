<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数据分析 - Polymarket Analysis</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f5;
      color: #222;
      min-height: 100vh;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem;
    }
    .header {
      margin-bottom: 2rem;
    }
    .header h1 {
      font-size: 2rem;
      color: #1a1a1a;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .header h1 span { color: #8b5cf6; }
    .nav-back {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      color: #666;
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 1rem;
      transition: all 0.2s ease;
    }
    .nav-back:hover {
      background: #f9fafb;
      color: #333;
    }
    .coming-soon {
      background: #fff;
      border-radius: 12px;
      padding: 4rem 2rem;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }
    .coming-soon .icon {
      font-size: 4rem;
      margin-bottom: 1rem;
    }
    .coming-soon h2 {
      font-size: 1.5rem;
      color: #8b5cf6;
      margin-bottom: 0.5rem;
    }
    .coming-soon p {
      color: #666;
      font-size: 1rem;
    }
    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-top: 2rem;
      text-align: left;
    }
    .feature {
      background: #f9fafb;
      border-radius: 8px;
      padding: 1rem;
    }
    .feature h3 {
      font-size: 1rem;
      color: #8b5cf6;
      margin-bottom: 0.5rem;
    }
    .feature p {
      font-size: 0.85rem;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="/" class="nav-back">← 返回首页</a>
    
    <div class="header">
      <h1><span>📈</span> 数据分析</h1>
    </div>

    <div class="coming-soon">
      <div class="icon">🔍</div>
      <h2>功能开发中</h2>
      <p>深入分析赔率变化趋势，挖掘市场机会</p>
      
      <div class="features">
        <div class="feature">
          <h3>📊 赔率趋势</h3>
          <p>追踪赔率变化，分析市场动向</p>
        </div>
        <div class="feature">
          <h3>🎯 机会识别</h3>
          <p>发现价格差异，识别套利机会</p>
        </div>
        <div class="feature">
          <h3>📉 历史回测</h3>
          <p>基于历史数据验证策略有效性</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
