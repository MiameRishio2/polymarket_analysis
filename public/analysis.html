<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数据分析 - Polymarket Analysis</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f5;
      color: #222;
      min-height: 100vh;
    }
    .container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 2rem;
    }
    .nav-back {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      color: #475569;
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 1rem;
      transition: all 0.2s ease;
    }
    .nav-back:hover {
      background: #f8fafc;
      color: #1e293b;
      border-color: #cbd5e1;
    }
    .header {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: flex-start;
      margin-bottom: 1.5rem;
    }
    .header h1 {
      font-size: 2rem;
      color: #111827;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .subtitle {
      color: #64748b;
      margin-top: 0.4rem;
      font-size: 0.95rem;
    }
    .refresh-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1rem;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      white-space: nowrap;
    }
    .refresh-btn:disabled {
      background: #94a3b8;
      cursor: default;
    }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    .summary-item {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 0.9rem 1rem;
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.04);
    }
    .summary-label {
      color: #64748b;
      font-size: 0.78rem;
      margin-bottom: 0.25rem;
    }
    .summary-value {
      color: #0f172a;
      font-size: 1.35rem;
      font-weight: 700;
    }
    .cards {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
    }
    .analysis-selector {
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      align-items: center;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 0.85rem 1rem;
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.04);
    }
    .analysis-selector label {
      color: #334155;
      font-size: 0.86rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .analysis-selector select {
      width: min(100%, 34rem);
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #fff;
      color: #0f172a;
      padding: 0.5rem 0.65rem;
      font-size: 0.9rem;
    }
    .odds-card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 1rem;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
    }
    .card-title {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: flex-start;
      margin-bottom: 0.75rem;
    }
    .matchup {
      font-size: 1rem;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.35;
    }
    .start-time {
      color: #64748b;
      font-size: 0.8rem;
      margin-top: 0.25rem;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      padding: 0.2rem 0.5rem;
      border-radius: 999px;
      background: #dcfce7;
      color: #166534;
      font-size: 0.72rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .status-pill.error {
      background: #fee2e2;
      color: #991b1b;
    }
    .source-block {
      border-top: 1px solid #f1f5f9;
      padding-top: 0.8rem;
      margin-top: 0.8rem;
    }
    .source-head {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: center;
      margin-bottom: 0.55rem;
    }
    .source-name {
      font-size: 0.88rem;
      font-weight: 700;
      color: #334155;
    }
    .prob-row {
      display: grid;
      grid-template-columns: 4.5rem 1fr 3.5rem;
      gap: 0.5rem;
      align-items: center;
      margin: 0.35rem 0;
      font-size: 0.82rem;
      color: #475569;
    }
    .bar-track {
      height: 0.55rem;
      border-radius: 999px;
      background: #e2e8f0;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: inherit;
      background: #0ea5e9;
      min-width: 2px;
    }
    .bar-fill.away { background: #f97316; }
    .source-error {
      color: #991b1b;
      background: #fef2f2;
      border-radius: 6px;
      padding: 0.6rem;
      font-size: 0.8rem;
    }
    .links {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 0.9rem;
    }
    .market-history {
      border-top: 1px solid #f1f5f9;
      padding-top: 0.9rem;
      margin-top: 0.9rem;
    }
    .history-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.75rem;
    }
    .history-title {
      font-size: 0.9rem;
      font-weight: 800;
      color: #0f172a;
    }
    .history-meta {
      color: #64748b;
      font-size: 0.78rem;
      white-space: nowrap;
    }
    .history-empty {
      color: #64748b;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 0.75rem;
      font-size: 0.82rem;
    }
    .timeline-scroll {
      overflow-x: auto;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      background: #fff;
    }
    .combined-chart {
      display: block;
      height: 260px;
      width: 100%;
      min-width: 0;
      overflow: visible;
    }
    .series-legend {
      min-width: 760px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 0.55rem;
      border-top: 1px solid #e2e8f0;
      padding: 0.75rem;
      background: #f8fafc;
    }
    .legend-item {
      display: grid;
      grid-template-columns: 1rem 0.75rem 1fr auto;
      gap: 0.5rem;
      align-items: center;
      color: #475569;
      font-size: 0.78rem;
      min-width: 0;
    }
    .legend-toggle {
      width: 1rem;
      height: 1rem;
      margin: 0;
      accent-color: #2563eb;
    }
    .legend-swatch {
      width: 0.7rem;
      height: 0.7rem;
      border-radius: 999px;
    }
    .legend-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .legend-latest {
      color: #0f172a;
      font-weight: 700;
      white-space: nowrap;
    }
    .link-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.35rem 0.65rem;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #fff;
      color: #334155;
      text-decoration: none;
      font-size: 0.78rem;
    }
    .link-btn:hover {
      border-color: #2563eb;
      color: #1d4ed8;
      background: #eff6ff;
    }
    .loading, .empty, .error-box {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 3rem 1rem;
      text-align: center;
      color: #64748b;
    }
    .error-box {
      color: #991b1b;
      background: #fef2f2;
      border-color: #fecaca;
    }
    @media (max-width: 720px) {
      .container { padding: 1rem; }
      .header { flex-direction: column; }
      .cards { grid-template-columns: 1fr; }
      .analysis-selector {
        align-items: stretch;
        flex-direction: column;
      }
      .analysis-selector select { width: 100%; }
      .series-legend { min-width: 680px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="/" class="nav-back">← 返回首页</a>

    <div class="header">
      <div>
        <h1><span aria-hidden="true">📈</span> 数据分析</h1>
        <p class="subtitle">监控比赛的 Polymarket 与 OddsPortal 胜负率对比</p>
      </div>
      <button class="refresh-btn" id="refresh-btn" onclick="refreshAnalysis(true, { force: true })">刷新</button>
    </div>

    <div class="summary-grid" id="summary-grid"></div>
    <div id="content" class="loading">加载中...</div>
  </div>

  <script>
    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function jsString(value) {
      return escapeHtml(JSON.stringify(String(value ?? '')));
    }

    function percent(value) {
      const numeric = Number(value);
      if (!Number.isFinite(numeric) || numeric <= 0) return '—';
      return `${(numeric * 100).toFixed(1)}%`;
    }

    function width(value) {
      const numeric = Number(value);
      if (!Number.isFinite(numeric) || numeric <= 0) return 0;
      return Math.max(0, Math.min(100, numeric * 100));
    }

    function sourceOk(source) {
      return source && source.status === 'ok';
    }

    function renderSource(name, source, homeTeam, awayTeam) {
      const statusClass = sourceOk(source) ? '' : 'error';
      const statusText = sourceOk(source) ? 'OK' : 'ERROR';
      const body = sourceOk(source)
        ? `
          <div class="prob-row">
            <span>${escapeHtml(homeTeam || '主队')}</span>
            <div class="bar-track"><div class="bar-fill" style="width:${width(source.home_probability)}%"></div></div>
            <strong>${percent(source.home_probability)}</strong>
          </div>
          <div class="prob-row">
            <span>${escapeHtml(awayTeam || '客队')}</span>
            <div class="bar-track"><div class="bar-fill away" style="width:${width(source.away_probability)}%"></div></div>
            <strong>${percent(source.away_probability)}</strong>
          </div>
        `
        : `<div class="source-error">${escapeHtml((source && source.error) || '暂无数据')}</div>`;

      return `
        <div class="source-block">
          <div class="source-head">
            <span class="source-name">${escapeHtml(name)}</span>
            <span class="status-pill ${statusClass}">${statusText}</span>
          </div>
          ${body}
        </div>
      `;
    }

    function oddsValue(value) {
      const numeric = Number(value);
      if (!Number.isFinite(numeric) || numeric <= 0) return '—';
      return numeric.toFixed(3).replace(/0+$/, '').replace(/\.$/, '');
    }

    function shortTime(value) {
      if (!value) return '';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value);
      return date.toLocaleTimeString([], { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function sparkline(points, color) {
      const values = points.map(point => Number(point.odds)).filter(Number.isFinite);
      if (values.length === 0) {
        return '<div class="history-empty">暂无时序点</div>';
      }

      const widthPx = Math.max(420, points.length * 54);
      const height = 42;
      const min = Math.min(...values);
      const max = Math.max(...values);
      const spread = max - min || 1;
      const coords = points.map((point, index) => {
        const x = points.length <= 1 ? widthPx - 10 : 10 + (index * (widthPx - 20)) / (points.length - 1);
        const numeric = Number(point.odds);
        const y = Number.isFinite(numeric) ? 8 + ((max - numeric) * 26) / spread : height / 2;
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(' ');
      const circles = points.map((point, index) => {
        const x = points.length <= 1 ? widthPx - 10 : 10 + (index * (widthPx - 20)) / (points.length - 1);
        const numeric = Number(point.odds);
        if (!Number.isFinite(numeric)) return '';
        const y = 8 + ((max - numeric) * 26) / spread;
        const label = point.kind === 'probability' ? percent(numeric) : oddsValue(numeric);
        return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.5" fill="${color}"><title>${escapeHtml(shortTime(point.captured_at))} ${escapeHtml(label)}</title></circle>`;
      }).join('');

      return `
        <svg class="sparkline" style="width:${widthPx}px" viewBox="0 0 ${widthPx} ${height}" preserveAspectRatio="none" aria-hidden="true">
          <line x1="10" y1="34" x2="${widthPx - 10}" y2="34" stroke="#e2e8f0" stroke-width="1" />
          <polyline points="${coords}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" />
          ${circles}
        </svg>
      `;
    }

    const knownBookmakerNames = {
      '1015': '1xBet',
      '417': '1xBet',
      '44': 'bet365',
      '102': 'William Hill',
      '500': '22bet',
      '550': 'GG.BET',
      '573': 'Melbet',
      '575': 'BetInAsia',
      '899': 'Cloudbet',
      '909': 'Bets.io',
      '911': 'BetFury',
      '941': 'Mozzartbet',
      '997': 'Stake.com',
      '1159': 'Shuffle'
    };

    function isPlaceholderBookmakerName(value) {
      const label = String(value || '').trim();
      return !label || /^\d+$/.test(label) || /^Bookmaker(?:\s+\d+)?$/i.test(label);
    }

    function bookmakerName(value, fallbackId) {
      const explicitName = String(value || '').trim();
      if (explicitName && !isPlaceholderBookmakerName(explicitName)) return explicitName;
      const id = String(fallbackId || value || '').trim();
      return knownBookmakerNames[id] || null;
    }

    function isFullTimeOneXTwo(row) {
      const label = String(row.market_label || '');
      const key = String(row.market_key || '');
      return label.includes('1X2') || key.includes('1X2') || key.includes('E-1-2-');
    }

    function oneXTwoProbabilityLines(row) {
      if (!isFullTimeOneXTwo(row)) return null;
      const outcomes = Array.isArray(row.outcomes) ? row.outcomes : [];
      const home = outcomes.find(outcome => String(outcome.label) === '1' || Number(outcome.index) === 0);
      const away = outcomes.find(outcome => String(outcome.label) === '2' || Number(outcome.index) === 2);
      const homeOdds = Number(home && home.odds);
      const awayOdds = Number(away && away.odds);
      if (!Number.isFinite(homeOdds) || !Number.isFinite(awayOdds) || homeOdds <= 1 || awayOdds <= 1) {
        return null;
      }
      const homeImplied = 1 / homeOdds;
      const awayImplied = 1 / awayOdds;
      const total = homeImplied + awayImplied;
      if (total <= 0) return null;
      return [
        { index: 0, label: '主胜率', odds: homeImplied / total },
        { index: 1, label: '客胜率', odds: awayImplied / total }
      ];
    }

    function historyPointValue(point) {
      if (!point) return '—';
      return point.kind === 'probability' ? percent(point.odds) : oddsValue(point.odds);
    }

    function historyMarketLabel(value) {
      const label = String(value || 'Market');
      return label.includes('1X2') ? label.replace('1X2', '主/客胜率') : label;
    }

    function buildSeries(history) {
      const snapshots = history.filter(snapshot => Array.isArray(snapshot.rows) && snapshot.rows.length > 0);
      const seriesMap = new Map();
      snapshots.forEach((snapshot, snapshotIndex) => {
        snapshot.rows.forEach(row => {
          const displayBookmakerName = bookmakerName(row.bookmaker_name, row.bookmaker_id);
          if (!displayBookmakerName) return;
          const probabilityLines = oneXTwoProbabilityLines(row);
          const outcomes = probabilityLines || (Array.isArray(row.outcomes) ? row.outcomes : []);
          outcomes.forEach(outcome => {
            const seriesKind = probabilityLines ? 'probability' : 'odds';
            const key = [
              row.market_key || row.market_label || 'market',
              row.bookmaker_id || 'bookmaker',
              seriesKind,
              outcome.label || outcome.index
            ].join('|');
            if (!seriesMap.has(key)) {
              seriesMap.set(key, {
                key,
                marketKey: row.market_key || '',
                marketLabel: historyMarketLabel(row.market_label),
                bookmakerId: displayBookmakerName,
                outcomeLabel: outcome.label || String(outcome.index),
                kind: seriesKind,
                points: snapshots.map(item => ({ captured_at: item.captured_at, odds: null, kind: seriesKind }))
              });
            }
            seriesMap.get(key).points[snapshotIndex] = {
              captured_at: snapshot.captured_at,
              odds: Number(outcome.odds),
              kind: seriesKind
            };
          });
        });
      });
      return { snapshots, series: Array.from(seriesMap.values()) };
    }

    function combinedSeriesChart(snapshots, series, colors) {
      const finiteValues = series
        .flatMap(item => item.points.map(point => Number(point.odds)))
        .filter(Number.isFinite);
      if (finiteValues.length === 0) {
        return '<div class="history-empty">暂无时序点</div>';
      }

      const widthPx = 760;
      const height = 260;
      const pad = { left: 54, right: 24, top: 20, bottom: 40 };
      const plotWidth = widthPx - pad.left - pad.right;
      const plotHeight = height - pad.top - pad.bottom;
      const min = Math.min(...finiteValues);
      const max = Math.max(...finiteValues);
      const spread = max - min || 1;
      const xFor = index => pad.left + (snapshots.length <= 1 ? plotWidth : (index * plotWidth) / (snapshots.length - 1));
      const yFor = value => pad.top + ((max - value) * plotHeight) / spread;
      const yTicks = [0, 0.25, 0.5, 0.75, 1].map(ratio => {
        const value = max - spread * ratio;
        const y = pad.top + plotHeight * ratio;
        return `
          <line x1="${pad.left}" y1="${y.toFixed(1)}" x2="${widthPx - pad.right}" y2="${y.toFixed(1)}" stroke="#e2e8f0" stroke-width="1" />
          <text x="${pad.left - 8}" y="${(y + 4).toFixed(1)}" text-anchor="end" fill="#64748b" font-size="11">${escapeHtml(oddsValue(value))}</text>
        `;
      }).join('');
      const tickStep = Math.max(1, Math.ceil(snapshots.length / 8));
      const xTicks = snapshots.map((snapshot, index) => {
        if (index !== 0 && index !== snapshots.length - 1 && index % tickStep !== 0) return '';
        const x = xFor(index);
        return `
          <line x1="${x.toFixed(1)}" y1="${pad.top}" x2="${x.toFixed(1)}" y2="${pad.top + plotHeight}" stroke="#f1f5f9" stroke-width="1" />
          <text x="${x.toFixed(1)}" y="${height - 14}" text-anchor="middle" fill="#64748b" font-size="11">${escapeHtml(shortTime(snapshot.captured_at))}</text>
        `;
      }).join('');
      const lines = series.map((row, rowIndex) => {
        const color = row.color || colors[rowIndex % colors.length];
        let path = '';
        let drawing = false;
        const points = row.points.map((point, pointIndex) => {
          const numeric = Number(point.odds);
          if (!Number.isFinite(numeric)) {
            drawing = false;
            return '';
          }
          const x = xFor(pointIndex);
          const y = yFor(numeric);
          path += `${drawing ? 'L' : 'M'} ${x.toFixed(1)} ${y.toFixed(1)} `;
          drawing = true;
          const label = [
            row.marketLabel,
            row.bookmakerId,
            row.outcomeLabel,
            historyPointValue(point),
            shortTime(point.captured_at)
          ].filter(Boolean).join(' · ');
          return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.4" fill="${color}"><title>${escapeHtml(label)}</title></circle>`;
        }).join('');
        return `
          <path d="${path.trim()}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" />
          ${points}
        `;
      }).join('');

      return `
        <svg class="combined-chart" style="width:100%" viewBox="0 0 ${widthPx} ${height}" role="img" aria-label="OddsPortal 全市场时序图">
          <rect x="0" y="0" width="${widthPx}" height="${height}" fill="#fff" />
          ${xTicks}
          ${yTicks}
          <line x1="${pad.left}" y1="${pad.top + plotHeight}" x2="${widthPx - pad.right}" y2="${pad.top + plotHeight}" stroke="#cbd5e1" stroke-width="1.2" />
          <line x1="${pad.left}" y1="${pad.top}" x2="${pad.left}" y2="${pad.top + plotHeight}" stroke="#cbd5e1" stroke-width="1.2" />
          ${lines}
        </svg>
      `;
    }

    const hiddenHistorySeriesKeys = new Set();

    function hideHistorySeries(key) {
      hiddenHistorySeriesKeys.add(String(key || ''));
    }

    function showHistorySeries(key) {
      hiddenHistorySeriesKeys.delete(String(key || ''));
    }

    function pruneHiddenHistorySeries(series) {
      const available = new Set(series.map(item => item.key));
      Array.from(hiddenHistorySeriesKeys).forEach(key => {
        if (!available.has(key)) hiddenHistorySeriesKeys.delete(key);
      });
    }

    function visibleHistorySeries(series) {
      pruneHiddenHistorySeries(series);
      return series.filter(item => !hiddenHistorySeriesKeys.has(item.key));
    }

    function toggleHistorySeries(key, checked) {
      markAnalysisInteraction();
      if (checked) {
        showHistorySeries(key);
      } else {
        hideHistorySeries(key);
      }
      loadAnalysis(false, false, { force: true });
    }

    function renderMarketHistory(history) {
      const { snapshots, series } = buildSeries(Array.isArray(history) ? history : []);
      if (snapshots.length === 0 || series.length === 0) {
        return `
          <section class="market-history">
            <div class="history-head">
              <div class="history-title">OddsPortal 全市场时序</div>
              <div class="history-meta">1 秒刷新</div>
            </div>
            <div class="history-empty">暂无 OddsPortal 全市场历史。下一次采集成功后会显示。</div>
          </section>
        `;
      }

      const colors = ['#2563eb', '#f97316', '#16a34a', '#7c3aed', '#dc2626', '#0891b2'];
      const coloredSeries = series.map((row, index) => ({ ...row, color: colors[index % colors.length] }));
      const visibleSeries = visibleHistorySeries(coloredSeries);
      const chartHtml = visibleSeries.length > 0
        ? combinedSeriesChart(snapshots, visibleSeries, colors)
        : '<div class="history-empty">已隐藏全部时序线。勾选下方项目可重新显示。</div>';
      const legendHtml = coloredSeries.map(row => {
        const latestPoint = row.points.slice().reverse().find(point => Number.isFinite(Number(point.odds)));
        const label = `${row.marketLabel} · ${row.bookmakerId} · ${row.outcomeLabel}`;
        const hidden = hiddenHistorySeriesKeys.has(row.key);
        const checked = hidden ? '' : ' checked';
        const latest = hidden ? '隐藏' : historyPointValue(latestPoint);
        return `
          <div class="legend-item">
            <input class="legend-toggle" type="checkbox"${checked} aria-label="显示或隐藏 ${escapeHtml(label)}" onchange="toggleHistorySeries(${jsString(row.key)}, this.checked)" />
            <span class="legend-swatch" style="background:${row.color}"></span>
            <span class="legend-name" title="${escapeHtml(label)}">${escapeHtml(label)}</span>
            <span class="legend-latest">${escapeHtml(latest)}</span>
          </div>
        `;
      }).join('');

      return `
        <section class="market-history">
          <div class="history-head">
            <div class="history-title">OddsPortal 全市场时序</div>
            <div class="history-meta">${snapshots.length} 个采样点 · ${visibleSeries.length}/${series.length} 条赔率线</div>
          </div>
          <div class="timeline-scroll">
            ${chartHtml}
            <div class="series-legend">${legendHtml}</div>
          </div>
        </section>
      `;
    }

    function renderCard(item, history) {
      return `
        <article class="odds-card">
          <div class="card-title">
            <div>
              <div class="matchup">${escapeHtml(item.matchup)}</div>
              <div class="start-time">${escapeHtml(item.start_time || '')}</div>
            </div>
            <span class="status-pill">${escapeHtml(formatCapturedAt(item.captured_at))}</span>
          </div>
          ${renderSource('OddsPortal', item.oddsportal, item.home_team, item.away_team)}
          ${renderSource('Polymarket', item.polymarket, item.home_team, item.away_team)}
          <div class="links">
            ${item.oddsportal_url ? `<a class="link-btn" target="_blank" rel="noopener noreferrer" href="${escapeHtml(item.oddsportal_url)}">OddsPortal</a>` : ''}
            ${item.polymarket_url ? `<a class="link-btn" target="_blank" rel="noopener noreferrer" href="${escapeHtml(item.polymarket_url)}">Polymarket</a>` : ''}
          </div>
          ${renderMarketHistory(history)}
        </article>
      `;
    }

    function formatCapturedAt(value) {
      if (!value) return '未采集';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return date.toLocaleString();
    }

    function renderSummary(items) {
      const okOddsPortal = items.filter(item => sourceOk(item.oddsportal)).length;
      const okPolymarket = items.filter(item => sourceOk(item.polymarket)).length;
      document.getElementById('summary-grid').innerHTML = `
        <div class="summary-item">
          <div class="summary-label">监控快照</div>
          <div class="summary-value">${items.length}</div>
        </div>
        <div class="summary-item">
          <div class="summary-label">OddsPortal OK</div>
          <div class="summary-value">${okOddsPortal}</div>
        </div>
        <div class="summary-item">
          <div class="summary-label">Polymarket OK</div>
          <div class="summary-value">${okPolymarket}</div>
        </div>
      `;
    }

    const interactionProtectionMs = 1200;
    let lastAnalysisInteractionAt = 0;
    let selectedAnalysisItemKey = null;

    function nowMs() {
      return Date.now();
    }

    function markAnalysisInteraction() {
      lastAnalysisInteractionAt = nowMs();
    }

    function analysisInteractionProtected() {
      return nowMs() - lastAnalysisInteractionAt < interactionProtectionMs;
    }

    function analysisItemKey(item, index = 0) {
      if (!item) return '';
      return String(item.match_id || item.oddsportal_url || item.polymarket_url || item.matchup || index);
    }

    function analysisItemLabel(item) {
      const matchup = String((item && item.matchup) || '未命名比赛');
      const startTime = String((item && item.start_time) || '').trim();
      return startTime ? `${matchup} · ${startTime}` : matchup;
    }

    function visibleAnalysisItems(items, selectedKey = selectedAnalysisItemKey) {
      if (!Array.isArray(items) || items.length === 0) return [];
      if (selectedKey) {
        const selectedItem = items.find((item, index) => analysisItemKey(item, index) === selectedKey);
        if (selectedItem) return [selectedItem];
      }
      return [items[0]];
    }

    function renderAnalysisSelector(items, selectedKey = selectedAnalysisItemKey) {
      if (!Array.isArray(items) || items.length <= 1) return '';
      const selected = selectedKey || analysisItemKey(items[0], 0);
      const options = items.map((item, index) => {
        const key = analysisItemKey(item, index);
        const isSelected = key === selected ? ' selected' : '';
        return `<option value="${escapeHtml(key)}"${isSelected}>${escapeHtml(analysisItemLabel(item))}</option>`;
      }).join('');
      return `
        <div class="analysis-selector">
          <label for="analysis-item-select">监控项</label>
          <select
            id="analysis-item-select"
            onfocus="markAnalysisInteraction()"
            onpointerdown="markAnalysisInteraction()"
            oninput="markAnalysisInteraction()"
            onchange="selectAnalysisItem(this.value)">
            ${options}
          </select>
        </div>
      `;
    }

    function selectAnalysisItem(value) {
      markAnalysisInteraction();
      selectedAnalysisItemKey = String(value || '');
      loadAnalysis(false, false, { force: true });
    }

    async function loadHistory(matchId) {
      if (!matchId) return [];
      const response = await fetch(`/api/analysis/oddsportal/${encodeURIComponent(matchId)}/history`);
      const result = await response.json();
      if (!result.ok) return [];
      return Array.isArray(result.data) ? result.data : [];
    }

    async function loadAnalysis(showLoading = true, collect = false, options = {}) {
      const automatic = Boolean(options.automatic);
      const force = Boolean(options.force);
      if (automatic && !force && analysisInteractionProtected()) return false;

      const btn = document.getElementById('refresh-btn');
      const content = document.getElementById('content');
      btn.disabled = true;
      if (showLoading) {
        content.className = 'loading';
        content.innerHTML = '加载中...';
      }

      try {
        const response = await fetch(collect ? '/api/analysis/odds/collect' : '/api/analysis/odds', {
          method: collect ? 'POST' : 'GET'
        });
        const result = await response.json();
        if (!result.ok) {
          throw new Error(result.error || '加载失败');
        }
        const items = Array.isArray(result.data) ? result.data : [];
        const visibleItems = visibleAnalysisItems(items);
        if (visibleItems[0]) {
          selectedAnalysisItemKey = analysisItemKey(visibleItems[0], items.indexOf(visibleItems[0]));
        }
        renderSummary(visibleItems);
        if (visibleItems.length === 0) {
          content.className = 'empty';
          content.innerHTML = '暂无监控赔率快照。请先在比赛页面加入监控并点击开始监控。';
        } else {
          const histories = await Promise.all(visibleItems.map(item => loadHistory(item.match_id)));
          content.className = 'cards';
          content.innerHTML = `
            ${renderAnalysisSelector(items, selectedAnalysisItemKey)}
            ${visibleItems.map((item, index) => renderCard(item, histories[index])).join('')}
          `;
        }
        return true;
      } catch (error) {
        if (showLoading) {
          document.getElementById('summary-grid').innerHTML = '';
          content.className = 'error-box';
          content.innerHTML = escapeHtml(error.message || String(error));
        }
        return false;
      } finally {
        btn.disabled = false;
      }
    }

    let refreshInFlight = false;
    async function refreshAnalysis(showLoading = false, options = {}) {
      if (refreshInFlight) return false;
      if (options.automatic && !options.force && analysisInteractionProtected()) return false;
      refreshInFlight = true;
      try {
        return await loadAnalysis(showLoading, true, options);
      } finally {
        refreshInFlight = false;
      }
    }

    loadAnalysis(true, true, { force: true });
    setInterval(() => refreshAnalysis(false, { automatic: true }), 1000);
  </script>
</body>
</html>
