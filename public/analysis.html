<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数据分析 - Polymarket Analysis</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f5;
      color: #222;
      min-height: 100vh;
    }
    .container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 2rem;
    }
    .nav-back {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      color: #475569;
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 1rem;
      transition: all 0.2s ease;
    }
    .nav-back:hover {
      background: #f8fafc;
      color: #1e293b;
      border-color: #cbd5e1;
    }
    .header {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: flex-start;
      margin-bottom: 1.5rem;
    }
    .header h1 {
      font-size: 2rem;
      color: #111827;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .subtitle {
      color: #64748b;
      margin-top: 0.4rem;
      font-size: 0.95rem;
    }
    .refresh-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1rem;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      white-space: nowrap;
    }
    .refresh-btn:disabled {
      background: #94a3b8;
      cursor: default;
    }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    .summary-item {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 0.9rem 1rem;
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.04);
    }
    .summary-label {
      color: #64748b;
      font-size: 0.78rem;
      margin-bottom: 0.25rem;
    }
    .summary-value {
      color: #0f172a;
      font-size: 1.35rem;
      font-weight: 700;
    }
    .cards {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
    }
    .odds-card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 1rem;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
    }
    .card-title {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: flex-start;
      margin-bottom: 0.75rem;
    }
    .matchup {
      font-size: 1rem;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.35;
    }
    .start-time {
      color: #64748b;
      font-size: 0.8rem;
      margin-top: 0.25rem;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      padding: 0.2rem 0.5rem;
      border-radius: 999px;
      background: #dcfce7;
      color: #166534;
      font-size: 0.72rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .status-pill.error {
      background: #fee2e2;
      color: #991b1b;
    }
    .source-block {
      border-top: 1px solid #f1f5f9;
      padding-top: 0.8rem;
      margin-top: 0.8rem;
    }
    .source-head {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: center;
      margin-bottom: 0.55rem;
    }
    .source-name {
      font-size: 0.88rem;
      font-weight: 700;
      color: #334155;
    }
    .prob-row {
      display: grid;
      grid-template-columns: 4.5rem 1fr 3.5rem;
      gap: 0.5rem;
      align-items: center;
      margin: 0.35rem 0;
      font-size: 0.82rem;
      color: #475569;
    }
    .bar-track {
      height: 0.55rem;
      border-radius: 999px;
      background: #e2e8f0;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: inherit;
      background: #0ea5e9;
      min-width: 2px;
    }
    .bar-fill.away { background: #f97316; }
    .source-error {
      color: #991b1b;
      background: #fef2f2;
      border-radius: 6px;
      padding: 0.6rem;
      font-size: 0.8rem;
    }
    .links {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 0.9rem;
    }
    .market-history {
      border-top: 1px solid #f1f5f9;
      padding-top: 0.9rem;
      margin-top: 0.9rem;
    }
    .history-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.75rem;
    }
    .history-title {
      font-size: 0.9rem;
      font-weight: 800;
      color: #0f172a;
    }
    .history-meta {
      color: #64748b;
      font-size: 0.78rem;
      white-space: nowrap;
    }
    .history-empty {
      color: #64748b;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 0.75rem;
      font-size: 0.82rem;
    }
    .timeline-scroll {
      overflow-x: auto;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      background: #fff;
    }
    .market-group {
      min-width: 920px;
      border-bottom: 1px solid #e2e8f0;
    }
    .market-group:last-child { border-bottom: none; }
    .market-label {
      position: sticky;
      left: 0;
      z-index: 2;
      background: #f8fafc;
      color: #1e293b;
      font-size: 0.82rem;
      font-weight: 800;
      padding: 0.55rem 0.75rem;
      border-bottom: 1px solid #e2e8f0;
    }
    .series-row {
      display: grid;
      grid-template-columns: 15rem minmax(420px, 1fr) 12rem;
      min-height: 3.75rem;
      border-bottom: 1px solid #f1f5f9;
      align-items: center;
    }
    .series-row:last-child { border-bottom: none; }
    .series-name {
      position: sticky;
      left: 0;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.2rem;
      background: #fff;
      border-right: 1px solid #f1f5f9;
      padding: 0.55rem 0.75rem;
      color: #334155;
      font-size: 0.78rem;
    }
    .series-name strong {
      color: #0f172a;
      font-size: 0.82rem;
    }
    .series-chart {
      padding: 0.45rem 0.75rem;
    }
    .sparkline {
      display: block;
      height: 42px;
      min-width: 420px;
      overflow: visible;
    }
    .series-latest {
      padding: 0.55rem 0.75rem;
      color: #475569;
      font-size: 0.78rem;
      line-height: 1.35;
    }
    .series-latest strong {
      color: #0f172a;
      font-size: 1rem;
    }
    .time-axis {
      min-width: 920px;
      display: grid;
      grid-template-columns: 15rem minmax(420px, 1fr) 12rem;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      color: #64748b;
      font-size: 0.72rem;
    }
    .time-axis-label,
    .time-axis-spacer {
      padding: 0.45rem 0.75rem;
    }
    .time-axis-label {
      position: sticky;
      left: 0;
      background: #f8fafc;
      z-index: 3;
      border-right: 1px solid #e2e8f0;
    }
    .time-ticks {
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.45rem 0.75rem;
      min-width: 420px;
    }
    .link-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.35rem 0.65rem;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #fff;
      color: #334155;
      text-decoration: none;
      font-size: 0.78rem;
    }
    .link-btn:hover {
      border-color: #2563eb;
      color: #1d4ed8;
      background: #eff6ff;
    }
    .loading, .empty, .error-box {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 3rem 1rem;
      text-align: center;
      color: #64748b;
    }
    .error-box {
      color: #991b1b;
      background: #fef2f2;
      border-color: #fecaca;
    }
    @media (max-width: 720px) {
      .container { padding: 1rem; }
      .header { flex-direction: column; }
      .cards { grid-template-columns: 1fr; }
      .series-row,
      .time-axis {
        grid-template-columns: 11rem minmax(360px, 1fr) 8rem;
      }
      .market-group,
      .time-axis {
        min-width: 760px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="/" class="nav-back">← 返回首页</a>

    <div class="header">
      <div>
        <h1><span aria-hidden="true">📈</span> 数据分析</h1>
        <p class="subtitle">监控比赛的 Polymarket 与 OddsPortal 胜负率对比</p>
      </div>
      <button class="refresh-btn" id="refresh-btn" onclick="refreshAnalysis(true)">刷新</button>
    </div>

    <div class="summary-grid" id="summary-grid"></div>
    <div id="content" class="loading">加载中...</div>
  </div>

  <script>
    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function percent(value) {
      const numeric = Number(value);
      if (!Number.isFinite(numeric) || numeric <= 0) return '—';
      return `${(numeric * 100).toFixed(1)}%`;
    }

    function width(value) {
      const numeric = Number(value);
      if (!Number.isFinite(numeric) || numeric <= 0) return 0;
      return Math.max(0, Math.min(100, numeric * 100));
    }

    function sourceOk(source) {
      return source && source.status === 'ok';
    }

    function renderSource(name, source, homeTeam, awayTeam) {
      const statusClass = sourceOk(source) ? '' : 'error';
      const statusText = sourceOk(source) ? 'OK' : 'ERROR';
      const body = sourceOk(source)
        ? `
          <div class="prob-row">
            <span>${escapeHtml(homeTeam || '主队')}</span>
            <div class="bar-track"><div class="bar-fill" style="width:${width(source.home_probability)}%"></div></div>
            <strong>${percent(source.home_probability)}</strong>
          </div>
          <div class="prob-row">
            <span>${escapeHtml(awayTeam || '客队')}</span>
            <div class="bar-track"><div class="bar-fill away" style="width:${width(source.away_probability)}%"></div></div>
            <strong>${percent(source.away_probability)}</strong>
          </div>
        `
        : `<div class="source-error">${escapeHtml((source && source.error) || '暂无数据')}</div>`;

      return `
        <div class="source-block">
          <div class="source-head">
            <span class="source-name">${escapeHtml(name)}</span>
            <span class="status-pill ${statusClass}">${statusText}</span>
          </div>
          ${body}
        </div>
      `;
    }

    function oddsValue(value) {
      const numeric = Number(value);
      if (!Number.isFinite(numeric) || numeric <= 0) return '—';
      return numeric.toFixed(3).replace(/0+$/, '').replace(/\.$/, '');
    }

    function shortTime(value) {
      if (!value) return '';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value);
      return date.toLocaleTimeString([], { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function sparkline(points, color) {
      const values = points.map(point => Number(point.odds)).filter(Number.isFinite);
      if (values.length === 0) {
        return '<div class="history-empty">暂无时序点</div>';
      }

      const widthPx = Math.max(420, points.length * 54);
      const height = 42;
      const min = Math.min(...values);
      const max = Math.max(...values);
      const spread = max - min || 1;
      const coords = points.map((point, index) => {
        const x = points.length <= 1 ? widthPx - 10 : 10 + (index * (widthPx - 20)) / (points.length - 1);
        const numeric = Number(point.odds);
        const y = Number.isFinite(numeric) ? 8 + ((max - numeric) * 26) / spread : height / 2;
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(' ');
      const circles = points.map((point, index) => {
        const x = points.length <= 1 ? widthPx - 10 : 10 + (index * (widthPx - 20)) / (points.length - 1);
        const numeric = Number(point.odds);
        if (!Number.isFinite(numeric)) return '';
        const y = 8 + ((max - numeric) * 26) / spread;
        const label = point.kind === 'probability' ? percent(numeric) : oddsValue(numeric);
        return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.5" fill="${color}"><title>${escapeHtml(shortTime(point.captured_at))} ${escapeHtml(label)}</title></circle>`;
      }).join('');

      return `
        <svg class="sparkline" style="width:${widthPx}px" viewBox="0 0 ${widthPx} ${height}" preserveAspectRatio="none" aria-hidden="true">
          <line x1="10" y1="34" x2="${widthPx - 10}" y2="34" stroke="#e2e8f0" stroke-width="1" />
          <polyline points="${coords}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" />
          ${circles}
        </svg>
      `;
    }

    function bookmakerName(value, fallbackId) {
      const explicitName = String(value || '').trim();
      if (explicitName && !/^\d+$/.test(explicitName)) return explicitName;
      const id = String(fallbackId || value || '').trim();
      const names = {
        '1015': '1xBet',
        '417': '1xBet',
        '44': 'bet365',
        '102': 'William Hill'
      };
      return names[id] || (id ? `Bookmaker ${id}` : 'Bookmaker');
    }

    function isFullTimeOneXTwo(row) {
      const label = String(row.market_label || '');
      const key = String(row.market_key || '');
      return label.includes('1X2') || key.includes('1X2') || key.includes('E-1-2-');
    }

    function oneXTwoProbabilityLines(row) {
      if (!isFullTimeOneXTwo(row)) return null;
      const outcomes = Array.isArray(row.outcomes) ? row.outcomes : [];
      const home = outcomes.find(outcome => String(outcome.label) === '1' || Number(outcome.index) === 0);
      const away = outcomes.find(outcome => String(outcome.label) === '2' || Number(outcome.index) === 2);
      const homeOdds = Number(home && home.odds);
      const awayOdds = Number(away && away.odds);
      if (!Number.isFinite(homeOdds) || !Number.isFinite(awayOdds) || homeOdds <= 1 || awayOdds <= 1) {
        return null;
      }
      const homeImplied = 1 / homeOdds;
      const awayImplied = 1 / awayOdds;
      const total = homeImplied + awayImplied;
      if (total <= 0) return null;
      return [
        { index: 0, label: '主胜率', odds: homeImplied / total },
        { index: 1, label: '客胜率', odds: awayImplied / total }
      ];
    }

    function historyPointValue(point) {
      if (!point) return '—';
      return point.kind === 'probability' ? percent(point.odds) : oddsValue(point.odds);
    }

    function historyMarketLabel(value) {
      const label = String(value || 'Market');
      return label.includes('1X2') ? label.replace('1X2', '主/客胜率') : label;
    }

    function buildSeries(history) {
      const snapshots = history.filter(snapshot => Array.isArray(snapshot.rows) && snapshot.rows.length > 0);
      const seriesMap = new Map();
      snapshots.forEach((snapshot, snapshotIndex) => {
        snapshot.rows.forEach(row => {
          const probabilityLines = oneXTwoProbabilityLines(row);
          const outcomes = probabilityLines || (Array.isArray(row.outcomes) ? row.outcomes : []);
          outcomes.forEach(outcome => {
            const seriesKind = probabilityLines ? 'probability' : 'odds';
            const key = [
              row.market_key || row.market_label || 'market',
              row.bookmaker_id || 'bookmaker',
              seriesKind,
              outcome.label || outcome.index
            ].join('|');
            if (!seriesMap.has(key)) {
              seriesMap.set(key, {
                key,
                marketKey: row.market_key || '',
                marketLabel: historyMarketLabel(row.market_label),
                bookmakerId: bookmakerName(row.bookmaker_name, row.bookmaker_id),
                outcomeLabel: outcome.label || String(outcome.index),
                kind: seriesKind,
                points: snapshots.map(item => ({ captured_at: item.captured_at, odds: null, kind: seriesKind }))
              });
            }
            seriesMap.get(key).points[snapshotIndex] = {
              captured_at: snapshot.captured_at,
              odds: Number(outcome.odds),
              kind: seriesKind
            };
          });
        });
      });
      return { snapshots, series: Array.from(seriesMap.values()) };
    }

    function groupByMarket(series) {
      return series.reduce((groups, item) => {
        const key = `${item.marketKey}|${item.marketLabel}`;
        if (!groups.has(key)) {
          groups.set(key, { label: item.marketLabel, rows: [] });
        }
        groups.get(key).rows.push(item);
        return groups;
      }, new Map());
    }

    function renderTimeAxis(snapshots) {
      const ticks = snapshots.slice(-8).map(snapshot => `<span>${escapeHtml(shortTime(snapshot.captured_at))}</span>`).join('');
      return `
        <div class="time-axis">
          <div class="time-axis-label">市场 / 庄家 / 结果</div>
          <div class="time-ticks">${ticks}</div>
          <div class="time-axis-spacer">最新</div>
        </div>
      `;
    }

    function renderMarketHistory(history) {
      const { snapshots, series } = buildSeries(Array.isArray(history) ? history : []);
      if (snapshots.length === 0 || series.length === 0) {
        return `
          <section class="market-history">
            <div class="history-head">
              <div class="history-title">OddsPortal 全市场时序</div>
              <div class="history-meta">1 秒刷新</div>
            </div>
            <div class="history-empty">暂无 OddsPortal 全市场历史。下一次采集成功后会显示。</div>
          </section>
        `;
      }

      const colors = ['#2563eb', '#f97316', '#16a34a', '#7c3aed', '#dc2626', '#0891b2'];
      const groups = Array.from(groupByMarket(series).values());
      const groupHtml = groups.map(group => {
        const rows = group.rows.map((row, index) => {
          const latestPoint = row.points.slice().reverse().find(point => Number.isFinite(Number(point.odds)));
          const color = colors[index % colors.length];
          return `
            <div class="series-row">
              <div class="series-name">
                <strong>${escapeHtml(row.bookmakerId)}</strong>
                <span>${escapeHtml(row.outcomeLabel)}</span>
              </div>
              <div class="series-chart">${sparkline(row.points, color)}</div>
              <div class="series-latest">
                <strong>${escapeHtml(historyPointValue(latestPoint))}</strong><br />
                ${escapeHtml(shortTime(latestPoint && latestPoint.captured_at))}
              </div>
            </div>
          `;
        }).join('');
        return `
          <section class="market-group">
            <div class="market-label">${escapeHtml(group.label)}</div>
            ${rows}
          </section>
        `;
      }).join('');

      return `
        <section class="market-history">
          <div class="history-head">
            <div class="history-title">OddsPortal 全市场时序</div>
            <div class="history-meta">${snapshots.length} 个采样点 · ${series.length} 条赔率线</div>
          </div>
          <div class="timeline-scroll">
            ${renderTimeAxis(snapshots)}
            ${groupHtml}
          </div>
        </section>
      `;
    }

    function renderCard(item, history) {
      return `
        <article class="odds-card">
          <div class="card-title">
            <div>
              <div class="matchup">${escapeHtml(item.matchup)}</div>
              <div class="start-time">${escapeHtml(item.start_time || '')}</div>
            </div>
            <span class="status-pill">${escapeHtml(formatCapturedAt(item.captured_at))}</span>
          </div>
          ${renderSource('OddsPortal', item.oddsportal, item.home_team, item.away_team)}
          ${renderSource('Polymarket', item.polymarket, item.home_team, item.away_team)}
          <div class="links">
            ${item.oddsportal_url ? `<a class="link-btn" target="_blank" rel="noopener noreferrer" href="${escapeHtml(item.oddsportal_url)}">OddsPortal</a>` : ''}
            ${item.polymarket_url ? `<a class="link-btn" target="_blank" rel="noopener noreferrer" href="${escapeHtml(item.polymarket_url)}">Polymarket</a>` : ''}
          </div>
          ${renderMarketHistory(history)}
        </article>
      `;
    }

    function formatCapturedAt(value) {
      if (!value) return '未采集';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return date.toLocaleString();
    }

    function renderSummary(items) {
      const okOddsPortal = items.filter(item => sourceOk(item.oddsportal)).length;
      const okPolymarket = items.filter(item => sourceOk(item.polymarket)).length;
      document.getElementById('summary-grid').innerHTML = `
        <div class="summary-item">
          <div class="summary-label">监控快照</div>
          <div class="summary-value">${items.length}</div>
        </div>
        <div class="summary-item">
          <div class="summary-label">OddsPortal OK</div>
          <div class="summary-value">${okOddsPortal}</div>
        </div>
        <div class="summary-item">
          <div class="summary-label">Polymarket OK</div>
          <div class="summary-value">${okPolymarket}</div>
        </div>
      `;
    }

    async function loadHistory(matchId) {
      if (!matchId) return [];
      const response = await fetch(`/api/analysis/oddsportal/${encodeURIComponent(matchId)}/history`);
      const result = await response.json();
      if (!result.ok) return [];
      return Array.isArray(result.data) ? result.data : [];
    }

    async function loadAnalysis(showLoading = true, collect = false) {
      const btn = document.getElementById('refresh-btn');
      const content = document.getElementById('content');
      btn.disabled = true;
      if (showLoading) {
        content.className = 'loading';
        content.innerHTML = '加载中...';
      }

      try {
        const response = await fetch(collect ? '/api/analysis/odds/collect' : '/api/analysis/odds', {
          method: collect ? 'POST' : 'GET'
        });
        const result = await response.json();
        if (!result.ok) {
          throw new Error(result.error || '加载失败');
        }
        const items = Array.isArray(result.data) ? result.data : [];
        renderSummary(items);
        if (items.length === 0) {
          content.className = 'empty';
          content.innerHTML = '暂无监控赔率快照。请先在比赛页面加入监控并点击开始监控。';
        } else {
          const histories = await Promise.all(items.map(item => loadHistory(item.match_id)));
          content.className = 'cards';
          content.innerHTML = items.map((item, index) => renderCard(item, histories[index])).join('');
        }
      } catch (error) {
        if (showLoading) {
          document.getElementById('summary-grid').innerHTML = '';
          content.className = 'error-box';
          content.innerHTML = escapeHtml(error.message || String(error));
        }
      } finally {
        btn.disabled = false;
      }
    }

    let refreshInFlight = false;
    async function refreshAnalysis(showLoading = false) {
      if (refreshInFlight) return;
      refreshInFlight = true;
      try {
        await loadAnalysis(showLoading, true);
      } finally {
        refreshInFlight = false;
      }
    }

    loadAnalysis(true, true);
    setInterval(() => refreshAnalysis(false), 1000);
  </script>
</body>
</html>
