<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⚽ 足球分类</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f5;
      color: #222;
      min-height: 100vh;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    h1 { font-size: 2rem; color: #1a1a1a; }
    .refresh-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1.2rem;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }
    .refresh-btn:hover:not(:disabled) { background: #2563eb; }
    .refresh-btn:disabled { background: #9ca3af; cursor: not-allowed; }
    .refresh-btn .spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid #fff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .refresh-btn.loading .spinner { display: block; }
    .refresh-btn.loading .refresh-icon { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .subtitle {
      color: #666;
      margin-bottom: 1rem;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    /* Progress Bar */
    .progress-container {
      background: #fff;
      border-radius: 8px;
      padding: 1rem 1.25rem;
      margin-bottom: 1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
      display: none;
    }
    .progress-container.active { display: block; }
    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }
    .progress-title { font-size: 0.9rem; font-weight: 600; color: #3b82f6; }
    .progress-percent { font-size: 0.85rem; color: #666; }
    .progress-bar {
      width: 100%;
      height: 8px;
      background: #e5e7eb;
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      border-radius: 4px;
      transition: width 0.3s ease;
    }
    .progress-detail {
      margin-top: 0.75rem;
      padding: 0.75rem;
      background: #f8fafc;
      border-radius: 6px;
      font-size: 0.85rem;
    }
    .progress-operation {
      color: #1e40af;
      font-weight: 500;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .progress-operation::before {
      content: '▶';
      color: #3b82f6;
      font-size: 0.7rem;
    }
    .progress-stats {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
    }
    .progress-stat {
      display: flex;
      flex-direction: column;
    }
    .progress-stat-label {
      font-size: 0.7rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .progress-stat-value { font-size: 1rem; font-weight: 600; color: #1f2937; }
    .progress-stat-value.processed { color: #059669; }
    .progress-stat-value.remaining { color: #dc2626; }
    .progress-stat-value.total { color: #7c3aed; }
    /* Stats bar */
    .stats-bar {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    .stat-badge {
      padding: 0.25rem 0.75rem;
      background: #fff;
      border-radius: 20px;
      font-size: 0.8rem;
      color: #666;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    /* List table */
    .list-table {
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }
    .list-header {
      display: grid;
      grid-template-columns: 80px 1fr 300px;
      padding: 0.75rem 1.25rem;
      background: #f8fafc;
      border-bottom: 1px solid #e5e7eb;
      font-size: 0.8rem;
      font-weight: 600;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .list-row {
      display: grid;
      grid-template-columns: 80px 1fr 300px;
      padding: 0.75rem 1.25rem;
      border-bottom: 1px solid #f0f0f0;
      align-items: center;
      transition: background 0.15s;
    }
    .list-row:last-child { border-bottom: none; }
    .list-row:hover { background: #f8fafc; }
    .list-row .type {
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      text-align: center;
      font-weight: 500;
    }
    .list-row .type.popular { background: #fef3c7; color: #92400e; }
    .list-row .type.country { background: #dbeafe; color: #1e40af; }
    .list-row .type.tournament { background: #d1fae5; color: #065f46; }
    .list-row .name { font-weight: 500; color: #333; }
    .list-row .url {
      font-size: 0.8rem;
      color: #3b82f6;
      font-family: monospace;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    /* Pagination */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1.5rem;
      padding: 1rem;
    }
    .page-btn {
      padding: 0.5rem 0.9rem;
      border: 1px solid #e5e7eb;
      background: #fff;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      color: #666;
      transition: all 0.2s;
    }
    .page-btn:hover:not(:disabled) {
      background: #3b82f6;
      color: #fff;
      border-color: #3b82f6;
    }
    .page-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .page-btn.active {
      background: #3b82f6;
      color: #fff;
      border-color: #3b82f6;
    }
    .page-info {
      padding: 0 1rem;
      font-size: 0.85rem;
      color: #888;
    }
    /* Loading & Error */
    .loading {
      text-align: center;
      color: #888;
      padding: 3rem;
    }
    .loading::after {
      content: '';
      display: inline-block;
      width: 20px;
      height: 20px;
      margin-left: 0.5rem;
      border: 2px solid #888;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
    }
    .error {
      text-align: center;
      color: #ef4444;
      padding: 2rem;
      background: #fef2f2;
      border-radius: 8px;
      margin: 1rem 0;
    }
    /* Toast */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #333;
      color: #fff;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-size: 0.9rem;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 1000;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.success { background: #22c55e; }
    .toast.error { background: #ef4444; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>⚽ 足球分类</h1>
      <button class="refresh-btn" id="refresh-btn" onclick="refreshData()">
        <span class="refresh-icon">🔄</span>
        <span class="spinner"></span>
        <span id="refresh-text">刷新</span>
      </button>
    </div>
    <div class="subtitle">
      <span id="last-updated"></span>
    </div>
    
    <!-- Progress Bar -->
    <div class="progress-container" id="progress-container">
      <div class="progress-header">
        <span class="progress-title" id="progress-title">正在刷新...</span>
        <span class="progress-percent" id="progress-percent">0%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
      </div>
      <div class="progress-detail">
        <div class="progress-operation" id="progress-operation">准备中...</div>
        <div class="progress-stats">
          <div class="progress-stat">
            <span class="progress-stat-label">已处理</span>
            <span class="progress-stat-value processed" id="processed-count">0</span>
          </div>
          <div class="progress-stat">
            <span class="progress-stat-label">总数</span>
            <span class="progress-stat-value total" id="total-count">0</span>
          </div>
          <div class="progress-stat">
            <span class="progress-stat-label">剩余</span>
            <span class="progress-stat-value remaining" id="remaining-count">0</span>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Stats -->
    <div class="stats-bar" id="stats-bar"></div>
    
    <!-- Content -->
    <div id="content"></div>
    
    <!-- Pagination -->
    <div class="pagination" id="pagination"></div>
  </div>
  
  <div class="toast" id="toast"></div>

  <script>
    const ITEMS_PER_PAGE = 10;
    let categoriesData = [];
    let currentPage = 1;
    let progressPolling = null;
    
    // Default football category data
    const defaultCategories = [
      { slug: "popular", name: "Popular", url: "", category_type: "popular" },
      { slug: "algeria", name: "Algeria", url: "/football/algeria/", category_type: "country" },
      { slug: "argentina", name: "Argentina", url: "/football/argentina/", category_type: "country" },
      { slug: "zimbabwe", name: "Zimbabwe", url: "/football/zimbabwe/", category_type: "country" },
      { slug: "england-premier-league", name: "England - Premier League", url: "/football/england/premier-league/", category_type: "tournament" },
      { slug: "spain-la-liga", name: "Spain - La Liga", url: "/football/spain/laliga/", category_type: "tournament" },
      { slug: "germany-bundesliga", name: "Germany - Bundesliga", url: "/football/germany/bundesliga/", category_type: "tournament" },
      { slug: "italy-serie-a", name: "Italy - Serie A", url: "/football/italy/serie-a/", category_type: "tournament" },
      { slug: "france-ligue-1", name: "France - Ligue 1", url: "/football/france/ligue-1/", category_type: "tournament" },
      { slug: "champions-league", name: "UEFA Champions League", url: "/football/europe/champions-league/", category_type: "tournament" },
    ];

    // Toast notification
    function showToast(message, type = 'info') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = 'toast ' + type;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }
    
    // Set loading state
    function setLoading(loading) {
      const btn = document.getElementById('refresh-btn');
      btn.disabled = loading;
      if (loading) {
        btn.classList.add('loading');
      } else {
        btn.classList.remove('loading');
      }
    }
    
    // Show progress bar
    function showProgress() {
      document.getElementById('progress-container').classList.add('active');
      resetProgress();
    }
    
    function hideProgress() {
      document.getElementById('progress-container').classList.remove('active');
    }
    
    function resetProgress() {
      document.getElementById('progress-title').textContent = '正在刷新...';
      document.getElementById('progress-percent').textContent = '0%';
      document.getElementById('progress-fill').style.width = '0%';
      document.getElementById('progress-operation').textContent = '准备中...';
      document.getElementById('processed-count').textContent = '0';
      document.getElementById('total-count').textContent = '0';
      document.getElementById('remaining-count').textContent = '0';
    }
    
    // Progress polling
    function startProgressPolling() {
      stopProgressPolling();
      progressPolling = setInterval(async () => {
        try {
          const res = await fetch('/api/football/progress');
          const data = await res.json();
          updateProgressUI(data);
        } catch (e) {
          console.error('Progress polling error:', e);
        }
      }, 500);
    }
    
    function stopProgressPolling() {
      if (progressPolling) {
        clearInterval(progressPolling);
        progressPolling = null;
      }
    }
    
    function updateProgressUI(data) {
      if (!data.in_progress) {
        stopProgressPolling();
        hideProgress();
        return;
      }
      
      document.getElementById('progress-title').textContent = '正在刷新足球数据';
      document.getElementById('progress-percent').textContent = data.percent + '%';
      document.getElementById('progress-fill').style.width = data.percent + '%';
      document.getElementById('progress-operation').textContent = data.current_operation || '处理中...';
      document.getElementById('processed-count').textContent = data.processed_items;
      document.getElementById('total-count').textContent = data.total_items;
      document.getElementById('remaining-count').textContent = data.total_items - data.processed_items;
    }
    
    // Fetch data
    async function fetchData() {
      setLoading(true);
      try {
        const response = await fetch('/api/football');
        const result = await response.json();
        
        if (result.ok && result.data) {
          categoriesData = result.data.categories || [];
          const lastUpdated = document.getElementById('last-updated');
          if (result.data.last_updated) {
            const date = new Date(result.data.last_updated);
            lastUpdated.textContent = '更新: ' + date.toLocaleTimeString();
          }
        } else {
          renderDefaultCategories();
        }
        
        renderPage(1);
      } catch (e) {
        console.error('Failed to fetch data:', e);
        renderDefaultCategories();
      } finally {
        setLoading(false);
      }
    }
    
    // Refresh data
    async function refreshData() {
      setLoading(true);
      showProgress();
      showToast('正在刷新...', 'info');
      startProgressPolling();
      
      try {
        const response = await fetch('/api/football/refresh', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
        });
        const result = await response.json();
        stopProgressPolling();
        
        if (result.ok && result.data) {
          categoriesData = result.data.categories || [];
          const lastUpdated = document.getElementById('last-updated');
          if (result.data.last_updated) {
            const date = new Date(result.data.last_updated);
            lastUpdated.textContent = '更新: ' + date.toLocaleTimeString();
          }
          renderPage(1);
          showToast(result.message || '刷新成功！', 'success');
          setTimeout(hideProgress, 1000);
        } else {
          document.getElementById('progress-operation').textContent = result.error || '刷新失败';
          document.getElementById('progress-operation').style.color = '#ef4444';
          showToast(result.error || '刷新失败', 'error');
        }
      } catch (e) {
        console.error('Failed to refresh:', e);
        stopProgressPolling();
        showToast('刷新请求失败', 'error');
      } finally {
        setLoading(false);
      }
    }
    
    // Render default categories
    function renderDefaultCategories() {
      categoriesData = defaultCategories;
      renderPage(1);
    }
    
    // Render current page
    function renderPage(page) {
      currentPage = page;
      const list = categoriesData.length > 0 ? categoriesData : defaultCategories;
      
      // Render stats
      const typeCount = {};
      list.forEach(c => {
        typeCount[c.category_type] = (typeCount[c.category_type] || 0) + 1;
      });
      
      document.getElementById('stats-bar').innerHTML = Object.entries(typeCount)
        .map(([type, count]) => `<span class="stat-badge">${type}: ${count}</span>`)
        .join('') + `<span class="stat-badge">总计: ${list.length}</span>`;
      
      // Calculate pagination
      const totalPages = Math.ceil(list.length / ITEMS_PER_PAGE) || 1;
      const start = (page - 1) * ITEMS_PER_PAGE;
      const end = start + ITEMS_PER_PAGE;
      const pageItems = list.slice(start, end);
      
      // Render table
      if (list.length === 0) {
        document.getElementById('content').innerHTML = '<div class="error">暂无数据</div>';
        document.getElementById('pagination').innerHTML = '';
        return;
      }
      
      document.getElementById('content').innerHTML = `
        <div class="list-table">
          <div class="list-header">
            <span>类型</span>
            <span>名称</span>
            <span>链接</span>
          </div>
          ${pageItems.map(cat => {
            const url = cat.url ? `https://www.oddsportal.com${cat.url}` : '#';
            const urlDisplay = cat.url || '(无链接)';
            return `
              <a href="${url}" target="_blank" class="list-row">
                <span class="type ${cat.category_type}">${cat.category_type}</span>
                <span class="name">${cat.name}</span>
                <span class="url">${urlDisplay}</span>
              </a>
            `;
          }).join('')}
        </div>
      `;
      
      // Render pagination
      renderPagination(page, totalPages, list.length);
    }
    
    // Render pagination controls
    function renderPagination(current, total, totalItems) {
      if (total <= 1) {
        document.getElementById('pagination').innerHTML = '';
        return;
      }
      
      let html = '';
      
      // Previous button
      html += `<button class="page-btn" onclick="renderPage(${current - 1})" ${current === 1 ? 'disabled' : ''}>上一页</button>`;
      
      // Page numbers
      const maxButtons = 5;
      let startPage = Math.max(1, current - Math.floor(maxButtons / 2));
      let endPage = Math.min(total, startPage + maxButtons - 1);
      
      if (endPage - startPage < maxButtons - 1) {
        startPage = Math.max(1, endPage - maxButtons + 1);
      }
      
      if (startPage > 1) {
        html += `<button class="page-btn" onclick="renderPage(1)">1</button>`;
        if (startPage > 2) {
          html += `<span class="page-info">...</span>`;
        }
      }
      
      for (let i = startPage; i <= endPage; i++) {
        html += `<button class="page-btn ${i === current ? 'active' : ''}" onclick="renderPage(${i})">${i}</button>`;
      }
      
      if (endPage < total) {
        if (endPage < total - 1) {
          html += `<span class="page-info">...</span>`;
        }
        html += `<button class="page-btn" onclick="renderPage(${total})">${total}</button>`;
      }
      
      // Next button
      html += `<button class="page-btn" onclick="renderPage(${current + 1})" ${current === total ? 'disabled' : ''}>下一页</button>`;
      
      document.getElementById('pagination').innerHTML = html;
    }
    
    // Initialize
    fetchData();
  </script>
</body>
</html>
