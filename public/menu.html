<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>体育分类</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f5;
      color: #222;
      min-height: 100vh;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem;
    }
    .top-nav {
      min-height: 2.25rem;
      margin-bottom: 0.75rem;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 0.8rem;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      background: #fff;
      color: #334155;
      text-decoration: none;
      font-size: 0.85rem;
      transition: all 0.15s;
    }
    .back-link:hover {
      border-color: #3b82f6;
      color: #1d4ed8;
      background: #eff6ff;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    h1 { font-size: 2rem; color: #1a1a1a; }
    .btn-group {
      display: flex;
      gap: 0.5rem;
    }
    .refresh-btn, .save-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1.2rem;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }
    .save-btn {
      background: #10b981;
    }
    .save-btn:hover:not(:disabled) { background: #059669; }
    .refresh-btn:hover:not(:disabled) { background: #2563eb; }
    .refresh-btn:disabled, .save-btn:disabled { background: #9ca3af; cursor: not-allowed; }
    .subtitle {
      color: #666;
      margin-bottom: 1rem;
      font-size: 0.85rem;
    }
    /* Stats bar */
    .stats-bar {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    .stat-badge {
      padding: 0.25rem 0.75rem;
      background: #fff;
      border-radius: 20px;
      font-size: 0.8rem;
      color: #666;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    /* List table */
    .list-table {
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }
    .list-header {
      display: grid;
      padding: 0.75rem 1.25rem;
      background: #f8fafc;
      border-bottom: 1px solid #e5e7eb;
      font-size: 0.8rem;
      font-weight: 600;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    /* Sports layout (2 columns) */
    .list-header.sports-grid {
      grid-template-columns: 1fr 2fr;
    }
    /* Category layout (3 columns) */
    .list-header.category-grid {
      grid-template-columns: 100px 1fr 2fr;
    }
    .list-row {
      display: grid;
      padding: 0.75rem 1.25rem;
      border-bottom: 1px solid #f0f0f0;
      align-items: center;
      transition: background 0.15s;
      text-decoration: none;
      color: inherit;
    }
    .list-row:last-child { border-bottom: none; }
    .list-row:hover { background: #f8fafc; }
    .list-row.sports-grid { grid-template-columns: 1fr 2fr; }
    .list-row.category-grid { grid-template-columns: 100px 1fr 2fr; }
    .list-row .slug { font-family: monospace; font-size: 0.85rem; color: #666; }
    .list-row .name { font-weight: 500; }
    .list-row .type {
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      text-align: center;
      font-weight: 500;
    }
    .list-row .type.country { background: #dbeafe; color: #1e40af; }
    .list-row .type.global { background: #fef3c7; color: #92400e; }
    .list-row .type.tournament { background: #dcfce7; color: #166534; }
    .list-row .type.league { background: #f3e8ff; color: #7c3aed; }
    .list-row .type.other { background: #f1f5f9; color: #475569; }
    .list-row .url {
      font-family: monospace;
      font-size: 0.8rem;
      color: #94a3b8;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    /* Pagination */
    .pagination {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }
    .page-btn {
      padding: 0.5rem 1rem;
      border: 1px solid #e5e7eb;
      background: #fff;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .page-btn:hover:not(:disabled) {
      background: #3b82f6;
      color: #fff;
      border-color: #3b82f6;
    }
    .page-btn:disabled {
      background: #f1f5f9;
      color: #9ca3af;
      cursor: not-allowed;
    }
    .page-btn.active {
      background: #3b82f6;
      color: #fff;
      border-color: #3b82f6;
    }
    .page-info {
      padding: 0.5rem;
      color: #9ca3af;
      font-size: 0.85rem;
    }
    /* Loading */
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 4rem;
      color: #666;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #e5e7eb;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 4rem;
      color: #9ca3af;
    }
    .empty-state-icon { font-size: 3rem; margin-bottom: 1rem; }
    /* Error */
    .error {
      background: #fef2f2;
      color: #991b1b;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
    }
    .error-icon { margin-right: 0.5rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-nav" id="top-nav"></div>
    <div class="header">
      <h1 id="page-title">体育分类</h1>
      <div class="btn-group">
        <button class="save-btn" id="save-btn" onclick="saveData()">
          <span>💾</span> 保存
        </button>
        <button class="refresh-btn" id="refresh-btn" onclick="refreshData()">
          <span>🔄</span> 刷新页面
        </button>
      </div>
    </div>
    <p class="subtitle" id="page-subtitle">正在加载数据...</p>
    
    <div id="error-container"></div>
    
    <!-- Stats bar -->
    <div class="stats-bar" id="stats-bar"></div>
    
    <!-- Content -->
    <div id="content">
      <div class="loading">
        <div class="spinner"></div>
        <span>加载中...</span>
      </div>
    </div>
    
    <!-- Pagination -->
    <div class="pagination" id="pagination"></div>
  </div>

  <script>
    // Data
    let data = [];
    let currentPage = 1;
    let sport = '';
    
    const ITEMS_PER_PAGE = 10;

    function getMenuPathSegments() {
      return window.location.pathname
        .split('/')
        .filter(Boolean);
    }
    
    // Get sport from path
    function getSportFromPath() {
      const segments = getMenuPathSegments();
      if (segments[0] === 'menu' && segments[1]) return segments[1];
      return 'football';
    }

    function getParentMenuHref() {
      const segments = getMenuPathSegments();
      if (segments[0] !== 'menu' || segments.length <= 1) return null;
      return `/${segments.slice(0, -1).join('/')}`;
    }

    function renderParentNavigation() {
      const topNav = document.getElementById('top-nav');
      if (!topNav) return;

      const parentHref = getParentMenuHref();
      topNav.innerHTML = parentHref
        ? `<a href="${parentHref}" class="back-link" aria-label="返回上一级"><span aria-hidden="true">←</span><span>返回上一级</span></a>`
        : '';
    }
    
    // Page config
    function getPageConfig() {
      const segments = getMenuPathSegments();

      if (segments[0] === 'menu' && segments[1] && segments[2] && segments[3]) {
        const sport = segments[1];
        const category = segments[2];
        const league = segments[3];

        return {
          type: 'fourth-level',
          title: `${formatNameFromSlug(league)} 分类`,
          subtitle: '点击链接跳转到 OddsPortal',
          apiUrl: `/api/menu/${sport}/${category}/${league}`,
          refreshUrl: `/api/menu/${sport}/${category}/${league}/refresh`,
          localKey: `categories_${sport}_${category}_${league}`,
          statsPrefix: '个分类',
          linkBase: `/${sport}/${category}/${league}/`
        };
      }

      if (segments[0] === 'menu' && segments[1] && segments[2]) {
        const sport = segments[1];
        const category = segments[2];

        return {
          type: 'third-level',
          title: `${formatNameFromSlug(category)} 分类`,
          subtitle: '点击链接查看下一级分类',
          apiUrl: `/api/menu/${sport}/${category}`,
          refreshUrl: `/api/menu/${sport}/${category}/refresh`,
          localKey: `categories_${sport}_${category}`,
          statsPrefix: '个分类',
          linkBase: `/menu/${sport}/${category}/`
        };
      }

      if (segments[0] === 'menu' && segments[1]) {
        const category = segments[1];

        return {
          type: 'category',
          title: getCategoryTitle(category),
          subtitle: '点击链接跳转到 OddsPortal',
          apiUrl: `/api/menu/${category}`,
          refreshUrl: `/api/menu/${category}/refresh`,
          localKey: `categories_${category}`,
          statsPrefix: '个分类',
          linkBase: `/menu/${category}/`
        };
      }
      
      return {
        type: 'sports',
        title: '体育分类',
        subtitle: '选择一个体育类别查看详情',
        apiUrl: '/api/menu',
        refreshUrl: '/api/menu/refresh',
        localKey: 'sports',
        statsPrefix: '个体育',
        linkBase: '/menu/'
      };
    }

    function formatNameFromSlug(slug) {
      return slug
        .split('-')
        .filter(Boolean)
        .map(word => word.charAt(0).toUpperCase() + word.slice(1))
        .join(' ');
    }
    
    // Get category title
    function getCategoryTitle(category) {
      const titles = {
        'football': '足球分类',
        'basketball': '篮球分类',
        'tennis': '网球分类',
        'baseball': '棒球分类',
        'hockey': '冰球分类',
        'rugby': '橄榄球分类',
        'mma': '综合格斗分类',
        'boxing': '拳击分类',
        'golf': '高尔夫分类',
        'racing': '赛车分类',
        'cycling': '自行车分类',
        'cricket': '板球分类',
        'volleyball': '排球分类',
        'handball': '手球分类',
        'tabletennis': '乒乓球分类',
        'badminton': '羽毛球分类',
        'snooker': '斯诺克分类',
        'darts': '飞镖分类',
        'esports': '电竞分类',
        'politics': '政治分类',
        'entertainment': '娱乐分类',
      };
      return titles[category] || `${formatNameFromSlug(category)} 分类`;
    }

    function getCategoryRowHref(item, config) {
      if (config.type === 'category' || config.type === 'third-level' || config.type === 'fourth-level') {
        const parts = (item.url || '')
          .split('/')
          .filter(Boolean);

        if (config.type === 'category' && parts.length >= 2) {
          return `/menu/${parts[0]}/${parts[1]}/`;
        }

        if (config.type === 'third-level' && parts.length >= 3) {
          return `/menu/${parts[0]}/${parts[1]}/${parts[2]}/`;
        }

        return `${config.linkBase}${item.slug}/`;
      }

      return item.url || '#';
    }
    
    // Fetch data from API
    async function fetchData() {
      sport = getSportFromPath();
      const config = getPageConfig();
      
      try {
        const response = await fetch(config.apiUrl);
        const result = await response.json();
        
        if (result.ok && result.data) {
          data = result.data.categories || [];
          document.getElementById('error-container').innerHTML = '';
          renderPage(1);
        } else {
          showError(result.error || '获取数据失败');
        }
      } catch (error) {
        showError('网络请求失败: ' + error.message);
      }
    }
    

    // Refresh data from server
    async function refreshData() {
      const btn = document.getElementById('refresh-btn');
      const originalText = btn.innerHTML;

      btn.disabled = true;
      btn.innerHTML = '<span>🔄</span> 刷新中...';

      const config = getPageConfig();

      try {
        const response = await fetch(config.refreshUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        });
        const result = await response.json();

        if (result.ok && result.data) {
          data = result.data.categories || [];
          document.getElementById('error-container').innerHTML = '';
          renderPage(1);
          btn.innerHTML = '<span>✓</span> 已刷新!';
          setTimeout(() => {
            btn.innerHTML = originalText;
            btn.disabled = false;
          }, 1500);
        } else {
          showError(result.error || '刷新数据失败');
          btn.innerHTML = '<span>✗</span> 刷新失败';
          setTimeout(() => {
            btn.innerHTML = originalText;
            btn.disabled = false;
          }, 2000);
        }
      } catch (error) {
        showError('网络请求失败: ' + error.message);
        btn.innerHTML = '<span>✗</span> 刷新失败';
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.disabled = false;
        }, 2000);
      }
    }
    // Save data to localStorage
    function saveData() {
      const config = getPageConfig();
      const btn = document.getElementById('save-btn');

      const originalText = btn.innerHTML;
      
      try {
        // Save current data to localStorage
        localStorage.setItem(config.localKey, JSON.stringify(data));
        
        // Show confirmation
        btn.innerHTML = '<span>✓</span> 已保存!';
        btn.disabled = true;
        
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.disabled = false;
        }, 1500);
      } catch (error) {
        showError('保存失败: ' + error.message);
      }
    }
    
    // Show error message
    function showError(message) {
      document.getElementById('error-container').innerHTML = `
        <div class="error"><span class="error-icon">⚠️</span>${message}</div>
      `;
      document.getElementById('content').innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">⚠️</div>
          <p>加载失败，请稍后重试</p>
        </div>
      `;
    }

    // Render stats bar
    function renderStats() {
      const config = getPageConfig();
      const statsBar = document.getElementById('stats-bar');
      
      if (config.type === 'category' || config.type === 'third-level' || config.type === 'fourth-level') {
        // Count by category type
        const typeCount = {};
        data.forEach(item => {
          const type = item.category_type || 'other';
          typeCount[type] = (typeCount[type] || 0) + 1;
        });
        
        statsBar.innerHTML = Object.entries(typeCount)
          .map(([type, count]) => `<span class="stat-badge type ${type}">${type}: ${count}</span>`)
          .join('') + `<span class="stat-badge">总计: ${data.length}</span>`;
      } else {
        statsBar.innerHTML = `<span class="stat-badge">总计: ${data.length} ${config.statsPrefix}</span>`;
      }
    }

    // Render current page
    function renderPage(page) {
      currentPage = page;
      const config = getPageConfig();
      
      // Update page title and subtitle
      renderParentNavigation();
      document.getElementById('page-title').textContent = config.title;
      document.getElementById('page-subtitle').textContent = config.subtitle;
      document.title = config.title;
      
      // Render stats
      renderStats();
      
      // Calculate pagination
      const totalPages = Math.ceil(data.length / ITEMS_PER_PAGE) || 1;
      const start = (page - 1) * ITEMS_PER_PAGE;
      const end = start + ITEMS_PER_PAGE;
      const pageItems = data.slice(start, end);
      
      // Check empty state
      if (data.length === 0) {
        document.getElementById('content').innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📭</div>
            <p>暂无数据</p>
          </div>
        `;
        document.getElementById('pagination').innerHTML = '';
        return;
      }
      
      // Render table based on type
      if (config.type === 'sports') {
        document.getElementById('content').innerHTML = `
          <div class="list-table">
            <div class="list-header sports-grid">
              <span>标识符</span>
              <span>名称</span>
            </div>
            ${pageItems.map(item => `
              <a href="${config.linkBase}${item.slug}" class="list-row sports-grid">
                <span class="slug">${item.slug}</span>
                <span class="name">${item.name}</span>
              </a>
            `).join('')}
          </div>
        `;
      } else {
        document.getElementById('content').innerHTML = `
          <div class="list-table">
            <div class="list-header category-grid">
              <span>类型</span>
              <span>名称</span>
              <span>链接</span>
            </div>
            ${pageItems.map(item => {
              const urlDisplay = item.url || '(无链接)';
              const type = item.category_type || 'other';
              const href = getCategoryRowHref(item, config);
              const target = config.type === 'fourth-level' ? ' target="_blank"' : '';
              return `
                <a href="${href}"${target} class="list-row category-grid">
                  <span class="type ${type}">${type}</span>
                  <span class="name">${item.name}</span>
                  <span class="url">${urlDisplay}</span>
                </a>
              `;
            }).join('')}
          </div>
        `;
      }
      
      // Render pagination
      renderPagination(page, totalPages);
    }

    // Render pagination controls
    function renderPagination(current, total) {
      if (total <= 1) {
        document.getElementById('pagination').innerHTML = '';
        return;
      }
      
      let html = '';
      
      // Previous button
      html += `<button class="page-btn" onclick="renderPage(${current - 1})" ${current === 1 ? 'disabled' : ''}>上一页</button>`;
      
      // Page numbers
      const maxButtons = 5;
      let startPage = Math.max(1, current - Math.floor(maxButtons / 2));
      let endPage = Math.min(total, startPage + maxButtons - 1);
      
      if (endPage - startPage < maxButtons - 1) {
        startPage = Math.max(1, endPage - maxButtons + 1);
      }
      
      if (startPage > 1) {
        html += `<button class="page-btn" onclick="renderPage(1)">1</button>`;
        if (startPage > 2) {
          html += `<span class="page-info">...</span>`;
        }
      }
      
      for (let i = startPage; i <= endPage; i++) {
        html += `<button class="page-btn ${i === current ? 'active' : ''}" onclick="renderPage(${i})">${i}</button>`;
      }
      
      if (endPage < total) {
        if (endPage < total - 1) {
          html += `<span class="page-info">...</span>`;
        }
        html += `<button class="page-btn" onclick="renderPage(${total})">${total}</button>`;
      }
      
      // Next button
      html += `<button class="page-btn" onclick="renderPage(${current + 1})" ${current === total ? 'disabled' : ''}>下一页</button>`;
      
      document.getElementById('pagination').innerHTML = html;
    }

    // Initialize page
    async function init() {
      await fetchData();
    }

    // Start
    init();
  </script>
</body>
</html>
