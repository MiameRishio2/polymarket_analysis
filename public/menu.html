<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>体育分类</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f5;
      color: #222;
      min-height: 100vh;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem;
    }
    .top-nav {
      min-height: 2.25rem;
      margin-bottom: 0.75rem;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 0.8rem;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      background: #fff;
      color: #334155;
      text-decoration: none;
      font-size: 0.85rem;
      transition: all 0.15s;
    }
    .back-link:hover {
      border-color: #3b82f6;
      color: #1d4ed8;
      background: #eff6ff;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    h1 { font-size: 2rem; color: #1a1a1a; }
    .btn-group {
      display: flex;
      gap: 0.5rem;
    }
    .refresh-btn, .save-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1.2rem;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }
    .save-btn {
      background: #10b981;
    }
    .save-btn:hover:not(:disabled) { background: #059669; }
    .refresh-btn:hover:not(:disabled) { background: #2563eb; }
    .refresh-btn:disabled, .save-btn:disabled { background: #9ca3af; cursor: not-allowed; }
    .subtitle {
      color: #666;
      margin-bottom: 1rem;
      font-size: 0.85rem;
    }
    /* Stats bar */
    .stats-bar {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    .stat-badge {
      padding: 0.25rem 0.75rem;
      background: #fff;
      border-radius: 20px;
      font-size: 0.8rem;
      color: #666;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    /* List table */
    .list-table {
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }
    .list-header {
      display: grid;
      padding: 0.75rem 1.25rem;
      background: #f8fafc;
      border-bottom: 1px solid #e5e7eb;
      font-size: 0.8rem;
      font-weight: 600;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    /* Sports layout (2 columns) */
    .list-header.sports-grid {
      grid-template-columns: 1fr 2fr;
    }
    /* Category layout (3 columns) */
    .list-header.category-grid {
      grid-template-columns: 100px 1fr 2fr;
    }
    .list-row {
      display: grid;
      padding: 0.75rem 1.25rem;
      border-bottom: 1px solid #f0f0f0;
      align-items: center;
      transition: background 0.15s;
      text-decoration: none;
      color: inherit;
    }
    .list-row:last-child { border-bottom: none; }
    .list-row:hover { background: #f8fafc; }
    .list-row.sports-grid { grid-template-columns: 1fr 2fr; }
    .list-row.category-grid { grid-template-columns: 100px 1fr 2fr; }
    .list-header.event-grid,
    .list-row.event-grid { grid-template-columns: 1.5fr 1fr 2fr; }
    .list-row .slug { font-family: monospace; font-size: 0.85rem; color: #666; }
    .list-row .name { font-weight: 500; }
    .list-row .type {
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      text-align: center;
      font-weight: 500;
    }
    .list-row .type.country { background: #dbeafe; color: #1e40af; }
    .list-row .type.global { background: #fef3c7; color: #92400e; }
    .list-row .type.tournament { background: #dcfce7; color: #166534; }
    .list-row .type.league { background: #f3e8ff; color: #7c3aed; }
    .list-row .type.other { background: #f1f5f9; color: #475569; }
    .list-row .url {
      font-family: monospace;
      font-size: 0.8rem;
      color: #94a3b8;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .list-row .time {
      font-size: 0.85rem;
      color: #475569;
    }
    .link-actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .link-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 6.5rem;
      min-height: 2rem;
      padding: 0.35rem 0.65rem;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #fff;
      color: #334155;
      text-decoration: none;
      font-size: 0.8rem;
      font-family: system-ui, -apple-system, sans-serif;
      white-space: nowrap;
    }
    .link-btn:hover {
      border-color: #3b82f6;
      color: #1d4ed8;
      background: #eff6ff;
    }
    .link-btn.disabled {
      color: #94a3b8;
      background: #f8fafc;
      border-color: #e2e8f0;
      cursor: not-allowed;
      pointer-events: none;
    }
    .scheduler-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 6rem;
      min-height: 2rem;
      padding: 0.35rem 0.65rem;
      border: 1px solid #86efac;
      border-radius: 6px;
      background: #f0fdf4;
      color: #166534;
      cursor: pointer;
      font-size: 0.8rem;
      font-family: system-ui, -apple-system, sans-serif;
      white-space: nowrap;
    }
    .scheduler-btn:hover:not(:disabled) {
      border-color: #22c55e;
      background: #dcfce7;
    }
    .scheduler-btn:disabled {
      border-color: #cbd5e1;
      background: #f8fafc;
      color: #64748b;
      cursor: default;
    }
    .scheduler-section {
      margin-bottom: 1rem;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
      overflow: hidden;
    }
    .scheduler-title {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: center;
      padding: 0.8rem 1.25rem;
      background: #f8fafc;
      border-bottom: 1px solid #e5e7eb;
      font-weight: 600;
      color: #334155;
    }
    .scheduler-empty {
      padding: 1rem 1.25rem;
      color: #94a3b8;
      font-size: 0.9rem;
    }
    .scheduler-row {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr 1.5fr;
      gap: 0.75rem;
      align-items: center;
      padding: 0.75rem 1.25rem;
      border-bottom: 1px solid #f1f5f9;
      font-size: 0.85rem;
    }
    .scheduler-row:last-child { border-bottom: none; }
    .scheduler-actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .scheduler-state {
      display: inline-flex;
      width: fit-content;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      background: #f1f5f9;
      color: #475569;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .scheduler-state.active {
      background: #dcfce7;
      color: #166534;
    }
    /* Pagination */
    .pagination {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }
    .page-btn {
      padding: 0.5rem 1rem;
      border: 1px solid #e5e7eb;
      background: #fff;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .page-btn:hover:not(:disabled) {
      background: #3b82f6;
      color: #fff;
      border-color: #3b82f6;
    }
    .page-btn:disabled {
      background: #f1f5f9;
      color: #9ca3af;
      cursor: not-allowed;
    }
    .page-btn.active {
      background: #3b82f6;
      color: #fff;
      border-color: #3b82f6;
    }
    .page-info {
      padding: 0.5rem;
      color: #9ca3af;
      font-size: 0.85rem;
    }
    /* Loading */
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 4rem;
      color: #666;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #e5e7eb;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 4rem;
      color: #9ca3af;
    }
    .empty-state-icon { font-size: 3rem; margin-bottom: 1rem; }
    /* Error */
    .error {
      background: #fef2f2;
      color: #991b1b;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
    }
    .error-icon { margin-right: 0.5rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-nav" id="top-nav"></div>
    <div class="header">
      <h1 id="page-title">体育分类</h1>
      <div class="btn-group">
        <button class="save-btn" id="save-btn" onclick="saveData()">
          <span>💾</span> 保存
        </button>
        <button class="refresh-btn" id="refresh-btn" onclick="refreshData()">
          <span>🔄</span> 刷新页面
        </button>
      </div>
    </div>
    <p class="subtitle" id="page-subtitle">正在加载数据...</p>
    
    <div id="error-container"></div>
    
    <!-- Stats bar -->
    <div class="stats-bar" id="stats-bar"></div>
    
    <!-- Content -->
    <div id="content">
      <div class="loading">
        <div class="spinner"></div>
        <span>加载中...</span>
      </div>
    </div>
    
    <!-- Pagination -->
    <div class="pagination" id="pagination"></div>
  </div>

  <script>
    // Data
    let data = [];
    let dataMode = 'categories';
    let currentPage = 1;
    let sport = '';
    let refreshedAt = '1970-01-01T00:00:00Z';
    let schedulerItems = [];
    let schedulerByKey = new Map();
    
    const ITEMS_PER_PAGE = 10;
    const DEFAULT_REFRESHED_AT = '1970-01-01T00:00:00Z';

    function getMenuPathSegments() {
      return window.location.pathname
        .split('/')
        .filter(Boolean);
    }
    
    // Get sport from path
    function getSportFromPath() {
      const segments = getMenuPathSegments();
      if (segments[0] === 'menu' && segments[1]) return segments[1];
      return 'football';
    }

    function getParentMenuHref() {
      const segments = getMenuPathSegments();
      if (segments[0] !== 'menu' || segments.length <= 1) return null;
      return `/${segments.slice(0, -1).join('/')}`;
    }

    function isRootMenuPage() {
      const segments = getMenuPathSegments();
      return segments.length === 1 && segments[0] === 'menu';
    }

    function renderParentNavigation() {
      const topNav = document.getElementById('top-nav');
      if (!topNav) return;

      const parentHref = getParentMenuHref();
      topNav.innerHTML = parentHref
        ? `<a href="${parentHref}" class="back-link" aria-label="返回上一级"><span aria-hidden="true">←</span><span>返回上一级</span></a>`
        : '';
    }
    
    // Page config
    function getPageConfig() {
      const segments = getMenuPathSegments();

      if (segments[0] === 'menu' && segments[1] && segments[2] && segments[3]) {
        const sport = segments[1];
        const category = segments[2];
        const league = segments[3];

        return {
          type: 'fourth-level',
          title: `${formatNameFromSlug(league)} 分类`,
          subtitle: '点击链接跳转到 OddsPortal',
          apiUrl: `/api/menu/${sport}/${category}/${league}`,
          refreshUrl: `/api/menu/${sport}/${category}/${league}/refresh`,
          eventApiUrl: `/api/events/${sport}/${category}/${league}`,
          eventRefreshUrl: `/api/events/${sport}/${category}/${league}/refresh`,
          localKey: `categories_${sport}_${category}_${league}`,
          eventLocalKey: `events_${sport}_${category}_${league}`,
          statsPrefix: '个分类',
          linkBase: `/${sport}/${category}/${league}/`
        };
      }

      if (segments[0] === 'menu' && segments[1] && segments[2]) {
        const sport = segments[1];
        const category = segments[2];

        return {
          type: 'third-level',
          title: `${formatNameFromSlug(category)} 分类`,
          subtitle: '点击链接查看下一级分类',
          apiUrl: `/api/menu/${sport}/${category}`,
          refreshUrl: `/api/menu/${sport}/${category}/refresh`,
          localKey: `categories_${sport}_${category}`,
          statsPrefix: '个分类',
          linkBase: `/menu/${sport}/${category}/`
        };
      }

      if (segments[0] === 'menu' && segments[1]) {
        const category = segments[1];

        return {
          type: 'category',
          title: getCategoryTitle(category),
          subtitle: '点击链接跳转到 OddsPortal',
          apiUrl: `/api/menu/${category}`,
          refreshUrl: `/api/menu/${category}/refresh`,
          localKey: `categories_${category}`,
          statsPrefix: '个分类',
          linkBase: `/menu/${category}/`
        };
      }
      
      return {
        type: 'sports',
        title: '体育分类',
        subtitle: '选择一个体育类别查看详情',
        apiUrl: '/api/menu',
        refreshUrl: '/api/menu/refresh',
        localKey: 'sports',
        statsPrefix: '个体育',
        linkBase: '/menu/'
      };
    }

    function formatNameFromSlug(slug) {
      return slug
        .split('-')
        .filter(Boolean)
        .map(word => word.charAt(0).toUpperCase() + word.slice(1))
        .join(' ');
    }
    
    // Get category title
    function getCategoryTitle(category) {
      const titles = {
        'football': '足球分类',
        'basketball': '篮球分类',
        'tennis': '网球分类',
        'baseball': '棒球分类',
        'hockey': '冰球分类',
        'rugby': '橄榄球分类',
        'mma': '综合格斗分类',
        'boxing': '拳击分类',
        'golf': '高尔夫分类',
        'racing': '赛车分类',
        'cycling': '自行车分类',
        'cricket': '板球分类',
        'volleyball': '排球分类',
        'handball': '手球分类',
        'tabletennis': '乒乓球分类',
        'badminton': '羽毛球分类',
        'snooker': '斯诺克分类',
        'darts': '飞镖分类',
        'esports': '电竞分类',
        'politics': '政治分类',
        'entertainment': '娱乐分类',
      };
      return titles[category] || `${formatNameFromSlug(category)} 分类`;
    }

    function getCategoryRowHref(item, config) {
      if (config.type === 'category' || config.type === 'third-level' || config.type === 'fourth-level') {
        const parts = (item.url || '')
          .split('/')
          .filter(Boolean);

        if (config.type === 'category' && parts.length >= 2) {
          return `/menu/${parts[0]}/${parts[1]}/`;
        }

        if (config.type === 'third-level' && parts.length >= 3) {
          return `/menu/${parts[0]}/${parts[1]}/${parts[2]}/`;
        }

        return `${config.linkBase}${item.slug}/`;
      }

      return item.url || '#';
    }

    function renderEventLinks(item, index = -1) {
      const oddsportalUrl = item.url || '';
      const oddsportal = oddsportalUrl
        ? `<a href="${oddsportalUrl}" target="_blank" rel="noopener noreferrer" class="link-btn">OddsPortal</a>`
        : '<span class="link-btn disabled" aria-disabled="true">OddsPortal</span>';
      const polymarket = item.polymarket_url
        ? `<a href="${item.polymarket_url}" target="_blank" rel="noopener noreferrer" class="link-btn">Polymarket</a>`
        : '<span class="link-btn disabled" aria-disabled="true">Polymarket</span>';
      const scheduler = renderSchedulerAction(item, index);

      return `<span class="link-actions">${oddsportal}${polymarket}${scheduler}</span>`;
    }

    function schedulerKeyFor(item) {
      return item.oddsportal_url || item.url || item.polymarket_url || [
        item.matchup || '',
        item.start_time || '',
        item.source_page || window.location.pathname
      ].join('|');
    }

    function rebuildSchedulerIndex() {
      schedulerByKey = new Map();
      schedulerItems.forEach(item => {
        schedulerByKey.set(schedulerKeyFor(item), item);
      });
    }

    function schedulerEntryFor(item) {
      return schedulerByKey.get(schedulerKeyFor(item));
    }

    async function fetchScheduler() {
      try {
        const response = await fetch('/api/scheduler');
        const result = await response.json();
        schedulerItems = result.ok && Array.isArray(result.data) ? result.data : [];
        rebuildSchedulerIndex();
      } catch (_) {
        schedulerItems = [];
        rebuildSchedulerIndex();
      }
    }

    function teamsForEvent(item) {
      if (item.home_team || item.away_team) {
        return {
          home: item.home_team || null,
          away: item.away_team || null
        };
      }
      const parts = (item.matchup || '').split(/\s+VS\s+/i);
      return {
        home: parts[0] || null,
        away: parts[1] || null
      };
    }

    async function scheduleEventByIndex(index) {
      if (!data[index]) return;
      await scheduleEvent(data[index]);
    }

    async function scheduleEvent(item) {
      const teams = teamsForEvent(item);
      const payload = {
        matchup: item.matchup || [teams.home, teams.away].filter(Boolean).join(' VS '),
        home_team: teams.home,
        away_team: teams.away,
        start_time: item.start_time || null,
        oddsportal_url: item.url || item.oddsportal_url || null,
        polymarket_url: item.polymarket_url || null,
        source_page: window.location.pathname,
        monitoring_started: false
      };

      const response = await fetch('/api/scheduler', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const result = await response.json();
      if (!result.ok || !result.data) {
        showError(result.error || '加入 scheduler 失败');
        return;
      }

      await fetchScheduler();
      renderPage(currentPage);
    }

    async function toggleScheduledMonitoring(id, monitoringStarted) {
      const response = await fetch(`/api/scheduler/${encodeURIComponent(id)}/monitoring`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ monitoring_started: monitoringStarted })
      });
      const result = await response.json();
      if (!result.ok) {
        showError(result.error || '更新监控状态失败');
        return;
      }
      await fetchScheduler();
      renderPage(currentPage);
    }

    async function deleteScheduledMatch(id) {
      const response = await fetch(`/api/scheduler/${encodeURIComponent(id)}`, {
        method: 'DELETE'
      });
      const result = await response.json();
      if (!result.ok) {
        showError(result.error || '删除 scheduler 条目失败');
        return;
      }
      await fetchScheduler();
      renderPage(currentPage);
    }

    function renderSchedulerAction(item, index) {
      const entry = schedulerEntryFor(item);
      if (entry) {
        return '<button class="scheduler-btn" disabled>已加入</button>';
      }
      const action = index >= 0 ? `scheduleEventByIndex(${index})` : 'scheduleEvent(this)';
      return `<button class="scheduler-btn" onclick="${action}">加入监控</button>`;
    }

    function renderSchedulerSection() {
      const rows = schedulerItems.length === 0
        ? '<div class="scheduler-empty">暂无 scheduler 条目</div>'
        : schedulerItems.map(item => `
            <div class="scheduler-row">
              <span class="name">${escapeHtml(item.matchup || '')}</span>
              <span class="time">${escapeHtml(item.start_time || '')}</span>
              <span class="scheduler-state ${item.monitoring_started ? 'active' : ''}">
                ${item.monitoring_started ? '监控中' : '未监控'}
              </span>
              <span class="scheduler-actions">
                ${item.oddsportal_url ? `<a href="${escapeAttr(item.oddsportal_url)}" target="_blank" rel="noopener noreferrer" class="link-btn">OddsPortal</a>` : ''}
                ${item.polymarket_url ? `<a href="${escapeAttr(item.polymarket_url)}" target="_blank" rel="noopener noreferrer" class="link-btn">Polymarket</a>` : ''}
                <button class="scheduler-btn" onclick="toggleScheduledMonitoring('${escapeAttr(item.id)}', ${!item.monitoring_started})">${item.monitoring_started ? '停止监控' : '开始监控'}</button>
                <button class="link-btn" onclick="deleteScheduledMatch('${escapeAttr(item.id)}')">删除</button>
              </span>
            </div>
          `).join('');

      return `
        <section class="scheduler-section">
          <div class="scheduler-title">
            <span>Scheduler</span>
            <span>${schedulerItems.length} 场比赛</span>
          </div>
          ${rows}
        </section>
      `;
    }

    function withRootScheduler(contentHtml) {
      return isRootMenuPage() ? renderSchedulerSection() + contentHtml : contentHtml;
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeAttr(value) {
      return escapeHtml(value);
    }
    
    // Fetch data from API
    async function fetchData() {
      sport = getSportFromPath();
      const config = getPageConfig();
      await fetchScheduler();
      
      try {
        if (config.type === 'fourth-level' && config.eventApiUrl) {
          try {
            logMenuInfo('event fetch start', { url: config.eventApiUrl });
            const eventResponse = await fetch(config.eventApiUrl);
            const eventResult = await eventResponse.json();
            logMenuInfo('event fetch response', eventResultSummary(eventResult));
            if (eventResult.ok && eventResult.data && Array.isArray(eventResult.data.events) && eventResult.data.events.length > 0) {
              data = eventResult.data.events;
              dataMode = 'events';
              refreshedAt = eventResult.data.refreshed_at || DEFAULT_REFRESHED_AT;
              document.getElementById('error-container').innerHTML = '';
              renderPage(1);
              return;
            }
            logMenuWarn('event fetch fallback to categories', eventResultSummary(eventResult));
          } catch (error) {
            logMenuWarn('event fetch failed; falling back to categories', {
              url: config.eventApiUrl,
              error: error && error.message ? error.message : String(error)
            });
            // Fall back to category data when event parsing is unavailable.
          }
        }

        logMenuInfo('category fetch start', { url: config.apiUrl });
        const response = await fetch(config.apiUrl);
        const result = await response.json();
        logMenuInfo('category fetch response', {
          ok: !!result.ok,
          source: result.data ? result.data.source : null,
          refreshedAt: result.data ? result.data.refreshed_at : null,
          categoryCount: result.data && Array.isArray(result.data.categories) ? result.data.categories.length : 0,
          error: result.error || null
        });
        
        if (result.ok && result.data) {
          data = result.data.categories || [];
          dataMode = 'categories';
          refreshedAt = result.data.refreshed_at || DEFAULT_REFRESHED_AT;
          document.getElementById('error-container').innerHTML = '';
          renderPage(1);
        } else {
          showError(result.error || '获取数据失败');
        }
      } catch (error) {
        showError('网络请求失败: ' + error.message);
      }
    }
    

    // Refresh data from server
    async function refreshData() {
      const btn = document.getElementById('refresh-btn');
      const originalText = btn.innerHTML;

      btn.disabled = true;
      btn.innerHTML = '<span>🔄</span> 刷新中...';

      const config = getPageConfig();

      try {
        if (config.type === 'fourth-level' && config.eventRefreshUrl) {
          try {
            logMenuInfo('event refresh start', { url: config.eventRefreshUrl });
            const eventResponse = await fetch(config.eventRefreshUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' }
            });
            const eventResult = await eventResponse.json();
            logMenuInfo('event refresh response', eventResultSummary(eventResult));
            if (eventResult.ok && eventResult.data && Array.isArray(eventResult.data.events) && eventResult.data.events.length > 0) {
              data = eventResult.data.events;
              dataMode = 'events';
              refreshedAt = eventResult.data.refreshed_at || DEFAULT_REFRESHED_AT;
              document.getElementById('error-container').innerHTML = '';
              renderPage(1);
              btn.innerHTML = '<span>✓</span> 已刷新!';
              setTimeout(() => {
                btn.innerHTML = originalText;
                btn.disabled = false;
              }, 1500);
              return;
            }
            logMenuWarn('event refresh fallback to categories', eventResultSummary(eventResult));
          } catch (error) {
            logMenuWarn('event refresh failed; falling back to categories', {
              url: config.eventRefreshUrl,
              error: error && error.message ? error.message : String(error)
            });
            // Fall back to category refresh when event refresh is unavailable.
          }
        }

        logMenuInfo('category refresh start', { url: config.refreshUrl });
        const response = await fetch(config.refreshUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        });
        const result = await response.json();
        logMenuInfo('category refresh response', {
          ok: !!result.ok,
          source: result.data ? result.data.source : null,
          refreshedAt: result.data ? result.data.refreshed_at : null,
          categoryCount: result.data && Array.isArray(result.data.categories) ? result.data.categories.length : 0,
          error: result.error || null
        });

        if (result.ok && result.data) {
          data = result.data.categories || [];
          dataMode = 'categories';
          refreshedAt = result.data.refreshed_at || DEFAULT_REFRESHED_AT;
          document.getElementById('error-container').innerHTML = '';
          renderPage(1);
          btn.innerHTML = '<span>✓</span> 已刷新!';
          setTimeout(() => {
            btn.innerHTML = originalText;
            btn.disabled = false;
          }, 1500);
        } else {
          showError(result.error || '刷新数据失败');
          btn.innerHTML = '<span>✗</span> 刷新失败';
          setTimeout(() => {
            btn.innerHTML = originalText;
            btn.disabled = false;
          }, 2000);
        }
      } catch (error) {
        showError('网络请求失败: ' + error.message);
        btn.innerHTML = '<span>✗</span> 刷新失败';
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.disabled = false;
        }, 2000);
      }
    }
    // Save data to localStorage
    function saveData() {
      const config = getPageConfig();
      const btn = document.getElementById('save-btn');

      const originalText = btn.innerHTML;
      
      try {
        // Save current data to localStorage
        const localKey = dataMode === 'events' && config.eventLocalKey ? config.eventLocalKey : config.localKey;
        localStorage.setItem(localKey, JSON.stringify(data));
        
        // Show confirmation
        btn.innerHTML = '<span>✓</span> 已保存!';
        btn.disabled = true;
        
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.disabled = false;
        }, 1500);
      } catch (error) {
        showError('保存失败: ' + error.message);
      }
    }
    
    // Show error message
    function showError(message) {
      document.getElementById('error-container').innerHTML = `
        <div class="error"><span class="error-icon">⚠️</span>${message}</div>
      `;
      document.getElementById('content').innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">⚠️</div>
          <p>加载失败，请稍后重试</p>
        </div>
      `;
    }

    // Render stats bar
    function renderStats() {
      const config = getPageConfig();
      const statsBar = document.getElementById('stats-bar');

      if (dataMode === 'events') {
        statsBar.innerHTML = `<span class="stat-badge">总计: ${data.length} 场比赛</span>${renderRefreshTimeBadge()}`;
        return;
      }
      
      if (config.type === 'category' || config.type === 'third-level' || config.type === 'fourth-level') {
        // Count by category type
        const typeCount = {};
        data.forEach(item => {
          const type = item.category_type || 'other';
          typeCount[type] = (typeCount[type] || 0) + 1;
        });
        
        statsBar.innerHTML = Object.entries(typeCount)
          .map(([type, count]) => `<span class="stat-badge type ${type}">${type}: ${count}</span>`)
          .join('') + `<span class="stat-badge">总计: ${data.length}</span>${renderRefreshTimeBadge()}`;
      } else {
        statsBar.innerHTML = `<span class="stat-badge">总计: ${data.length} ${config.statsPrefix}</span>${renderRefreshTimeBadge()}`;
      }
    }

    function renderRefreshTimeBadge() {
      return `<span class="stat-badge">刷新时间: ${refreshedAt || DEFAULT_REFRESHED_AT}</span>`;
    }

    function eventResultSummary(result) {
      const eventRows = result && result.data && Array.isArray(result.data.events)
        ? result.data.events
        : [];
      const missingPolymarket = eventRows
        .filter(item => !item.polymarket_url)
        .map(item => item.matchup || [item.home_team, item.away_team].filter(Boolean).join(' VS '))
        .filter(Boolean);

      return {
        ok: !!(result && result.ok),
        source: result && result.data ? result.data.source : null,
        refreshedAt: result && result.data ? result.data.refreshed_at : null,
        eventCount: eventRows.length,
        missingPolymarketCount: missingPolymarket.length,
        missingPolymarketSample: missingPolymarket.slice(0, 10),
        error: result ? result.error : null
      };
    }

    function logMenuInfo(message, detail) {
      console.log(`[menu] ${message}`, detail);
    }

    function logMenuWarn(message, detail) {
      console.warn(`[menu] ${message}`, detail);
    }

    // Render current page
    function renderPage(page) {
      currentPage = page;
      const config = getPageConfig();
      
      // Update page title and subtitle
      renderParentNavigation();
      document.getElementById('page-title').textContent = config.title;
      document.getElementById('page-subtitle').textContent = config.subtitle;
      document.title = config.title;
      
      // Render stats
      renderStats();
      
      // Calculate pagination
      const totalPages = Math.ceil(data.length / ITEMS_PER_PAGE) || 1;
      const start = (page - 1) * ITEMS_PER_PAGE;
      const end = start + ITEMS_PER_PAGE;
      const pageItems = data.slice(start, end);
      
      // Check empty state
      if (data.length === 0) {
        document.getElementById('content').innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📭</div>
            <p>暂无数据</p>
          </div>
        `;
        document.getElementById('pagination').innerHTML = '';
        return;
      }
      
      // Render table based on type
      if (dataMode === 'events') {
        document.getElementById('content').innerHTML = `
          <div class="list-table">
            <div class="list-header event-grid">
              <span>比赛</span>
              <span>开始时间</span>
              <span>链接</span>
            </div>
            ${pageItems.map((item, index) => `
              <div class="list-row event-grid">
                <span class="name">${item.matchup || ''}</span>
                <span class="time">${item.start_time || ''}</span>
                ${renderEventLinks(item, start + index)}
              </div>
            `).join('')}
          </div>
        `;
      } else if (config.type === 'sports') {
        document.getElementById('content').innerHTML = withRootScheduler(`
          <div class="list-table">
            <div class="list-header sports-grid">
              <span>标识符</span>
              <span>名称</span>
            </div>
            ${pageItems.map(item => `
              <a href="${config.linkBase}${item.slug}" class="list-row sports-grid">
                <span class="slug">${item.slug}</span>
                <span class="name">${item.name}</span>
              </a>
            `).join('')}
          </div>
        `);
      } else {
        document.getElementById('content').innerHTML = `
          <div class="list-table">
            <div class="list-header category-grid">
              <span>类型</span>
              <span>名称</span>
              <span>链接</span>
            </div>
            ${pageItems.map(item => {
              const urlDisplay = item.url || '(无链接)';
              const type = item.category_type || 'other';
              const href = getCategoryRowHref(item, config);
              const target = config.type === 'fourth-level' ? ' target="_blank"' : '';
              return `
                <a href="${href}"${target} class="list-row category-grid">
                  <span class="type ${type}">${type}</span>
                  <span class="name">${item.name}</span>
                  <span class="url">${urlDisplay}</span>
                </a>
              `;
            }).join('')}
          </div>
        `;
      }
      
      // Render pagination
      renderPagination(page, totalPages);
    }

    // Render pagination controls
    function renderPagination(current, total) {
      if (total <= 1) {
        document.getElementById('pagination').innerHTML = '';
        return;
      }
      
      let html = '';
      
      // Previous button
      html += `<button class="page-btn" onclick="renderPage(${current - 1})" ${current === 1 ? 'disabled' : ''}>上一页</button>`;
      
      // Page numbers
      const maxButtons = 5;
      let startPage = Math.max(1, current - Math.floor(maxButtons / 2));
      let endPage = Math.min(total, startPage + maxButtons - 1);
      
      if (endPage - startPage < maxButtons - 1) {
        startPage = Math.max(1, endPage - maxButtons + 1);
      }
      
      if (startPage > 1) {
        html += `<button class="page-btn" onclick="renderPage(1)">1</button>`;
        if (startPage > 2) {
          html += `<span class="page-info">...</span>`;
        }
      }
      
      for (let i = startPage; i <= endPage; i++) {
        html += `<button class="page-btn ${i === current ? 'active' : ''}" onclick="renderPage(${i})">${i}</button>`;
      }
      
      if (endPage < total) {
        if (endPage < total - 1) {
          html += `<span class="page-info">...</span>`;
        }
        html += `<button class="page-btn" onclick="renderPage(${total})">${total}</button>`;
      }
      
      // Next button
      html += `<button class="page-btn" onclick="renderPage(${current + 1})" ${current === total ? 'disabled' : ''}>下一页</button>`;
      
      document.getElementById('pagination').innerHTML = html;
    }

    // Initialize page
    async function init() {
      await fetchData();
    }

    // Start
    init();
  </script>
</body>
</html>
