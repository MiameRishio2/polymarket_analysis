<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⚽ 体育分类</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f5;
      color: #222;
      min-height: 100vh;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    h1 { font-size: 2rem; color: #1a1a1a; }
    .refresh-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1.2rem;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }
    .refresh-btn:hover:not(:disabled) { background: #2563eb; }
    .refresh-btn:disabled { background: #9ca3af; cursor: not-allowed; }
    .refresh-btn .spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid #fff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .refresh-btn.loading .spinner { display: block; }
    .refresh-btn.loading .refresh-icon { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .subtitle {
      color: #666;
      margin-bottom: 1rem;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .subtitle .last-updated { margin-left: auto; }
    /* Progress Bar */
    .progress-container {
      background: #fff;
      border-radius: 8px;
      padding: 1rem 1.25rem;
      margin-bottom: 1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
      display: none;
    }
    .progress-container.active { display: block; }
    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }
    .progress-title { font-size: 0.9rem; font-weight: 600; color: #3b82f6; }
    .progress-percent { font-size: 0.85rem; color: #666; }
    .progress-bar {
      width: 100%;
      height: 8px;
      background: #e5e7eb;
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      border-radius: 4px;
      transition: width 0.3s ease;
    }
    .progress-detail {
      margin-top: 0.75rem;
      padding: 0.75rem;
      background: #f8fafc;
      border-radius: 6px;
      font-size: 0.85rem;
    }
    .progress-operation {
      color: #1e40af;
      font-weight: 500;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .progress-operation::before {
      content: '▶';
      color: #3b82f6;
      font-size: 0.7rem;
    }
    .progress-stats {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
    }
    .progress-stat {
      display: flex;
      flex-direction: column;
    }
    .progress-stat-label {
      font-size: 0.7rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .progress-stat-value { font-size: 1rem; font-weight: 600; color: #1f2937; }
    .progress-stat-value.processed { color: #059669; }
    .progress-stat-value.remaining { color: #dc2626; }
    .progress-stat-value.total { color: #7c3aed; }
    /* Stats bar */
    .stats-bar {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    .stat-badge {
      padding: 0.25rem 0.75rem;
      background: #fff;
      border-radius: 20px;
      font-size: 0.8rem;
      color: #666;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    /* List table */
    .list-table {
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }
    .list-header {
      display: grid;
      padding: 0.75rem 1.25rem;
      background: #f8fafc;
      border-bottom: 1px solid #e5e7eb;
      font-size: 0.8rem;
      font-weight: 600;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .list-row {
      display: grid;
      padding: 0.75rem 1.25rem;
      border-bottom: 1px solid #f0f0f0;
      align-items: center;
      transition: background 0.15s;
      text-decoration: none;
      color: inherit;
    }
    .list-row:last-child { border-bottom: none; }
    .list-row:hover { background: #f8fafc; }
    .list-row .type {
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      text-align: center;
      font-weight: 500;
    }
    .list-row .type.popular { background: #fef3c7; color: #92400e; }
    .list-row .type.country { background: #dbeafe; color: #1e40af; }
    .list-row .type.tournament { background: #d1fae5; color: #065f46; }
    .list-row .type.league { background: #ede9fe; color: #5b21b6; }
    .list-row .type.other { background: #f3f4f6; color: #374151; }
    .list-row .slug {
      font-size: 0.85rem;
      color: #888;
      font-family: monospace;
    }
    .list-row .name {
      font-weight: 600;
      color: #333;
    }
    .list-row .url {
      font-size: 0.8rem;
      color: #3b82f6;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    /* Pagination */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1.5rem;
      padding: 1rem;
    }
    .page-btn {
      padding: 0.5rem 0.9rem;
      border: 1px solid #e5e7eb;
      background: #fff;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      color: #666;
      transition: all 0.2s;
    }
    .page-btn:hover:not(:disabled) {
      background: #3b82f6;
      color: #fff;
      border-color: #3b82f6;
    }
    .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .page-btn.active {
      background: #3b82f6;
      color: #fff;
      border-color: #3b82f6;
    }
    .page-info {
      padding: 0 1rem;
      font-size: 0.85rem;
      color: #888;
    }
    /* Current sport detail */
    .current-sport {
      background: #fff;
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
      margin-bottom: 1.5rem;
    }
    .current-sport h2 {
      font-size: 1.75rem;
      margin-bottom: 0.75rem;
      color: #1a1a1a;
    }
    .current-sport .sport-info {
      color: #666;
      font-size: 0.9rem;
      font-family: monospace;
      margin-top: 0.5rem;
    }
    .back-link {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.6rem 1.2rem;
      background: #3b82f6;
      color: #fff;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    .back-link:hover { background: #2563eb; }
    /* Loading & Error */
    .loading {
      text-align: center;
      color: #888;
      padding: 3rem;
    }
    .loading::after {
      content: '';
      display: inline-block;
      width: 20px;
      height: 20px;
      margin-left: 0.5rem;
      border: 2px solid #888;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
    }
    .error {
      text-align: center;
      color: #dc2626;
      padding: 2rem;
      background: #fef2f2;
      border-radius: 8px;
      margin: 1rem 0;
    }
    /* Toast notification */
    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      padding: 0.75rem 1.25rem;
      background: #1f2937;
      color: #fff;
      border-radius: 8px;
      font-size: 0.9rem;
      box-shadow: 0 4px 12px rgba(0,0,0,.15);
      opacity: 0;
      transform: translateY(1rem);
      transition: all 0.3s ease;
      z-index: 1000;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.success { background: #059669; }
    .toast.error { background: #dc2626; }
    /* Sport menu variant */
    .list-header.sports-grid { grid-template-columns: 200px 1fr; }
    .list-row.sports-grid { grid-template-columns: 200px 1fr; }
    /* Category variant */
    .list-header.category-grid { grid-template-columns: 100px 1fr 300px; }
    .list-row.category-grid { grid-template-columns: 100px 1fr 300px; }
    /* Active row */
    .list-row.active { background: #eff6ff; }
    .list-row.active:hover { background: #dbeafe; }
    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 3rem;
      color: #888;
    }
    .empty-state-icon { font-size: 3rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 id="page-title">📋 加载中...</h1>
      <button id="refresh-btn" class="refresh-btn" onclick="handleRefresh()">
        <span class="refresh-icon">🔄 刷新</span>
        <span class="spinner"></span>
      </button>
    </div>
    <p class="subtitle">
      <span id="page-subtitle">正在获取数据...</span>
      <span id="last-updated" class="last-updated"></span>
    </p>
    
    <!-- Progress bar (for football refresh) -->
    <div id="progress-container" class="progress-container">
      <div class="progress-header">
        <span class="progress-title">🔄 正在刷新数据...</span>
        <span id="progress-percent" class="progress-percent">0%</span>
      </div>
      <div class="progress-bar">
        <div id="progress-fill" class="progress-fill" style="width: 0%"></div>
      </div>
      <div class="progress-detail">
        <div id="progress-operation" class="progress-operation">准备中...</div>
        <div class="progress-stats">
          <div class="progress-stat">
            <span class="progress-stat-label">已处理</span>
            <span id="processed-count" class="progress-stat-value processed">0</span>
          </div>
          <div class="progress-stat">
            <span class="progress-stat-label">总计</span>
            <span id="total-count" class="progress-stat-value total">0</span>
          </div>
          <div class="progress-stat">
            <span class="progress-stat-label">剩余</span>
            <span id="remaining-count" class="progress-stat-value remaining">0</span>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Stats bar -->
    <div id="stats-bar" class="stats-bar"></div>
    
    <!-- Content area -->
    <div id="content">
      <div class="loading">加载中...</div>
    </div>
    
    <!-- Pagination -->
    <div id="pagination" class="pagination"></div>
  </div>
  
  <!-- Toast notification -->
  <div id="toast" class="toast"></div>

  <script>
    // Configuration
    const ITEMS_PER_PAGE = 10;
    
    // State
    let currentPage = 1;
    let data = [];
    let refreshProgress = { in_progress: false };
    let progressPollingInterval = null;
    
    // Default data (fallback when API fails)
    const defaultSports = [
      { slug: 'football', name: '⚽ FOOTBALL', url: '/football' },
      { slug: 'basketball', name: '🏀 BASKETBALL', url: '/basketball' },
      { slug: 'tennis', name: '🎾 TENNIS', url: '/tennis' },
      { slug: 'baseball', name: '⚾ BASEBALL', url: '/baseball' },
      { slug: 'hockey', name: '🏒 HOCKEY', url: '/hockey' },
      { slug: 'volleyball', name: '🏐 VOLLEYBALL', url: '/volleyball' },
      { slug: 'handball', name: '🤾 HANDBALL', url: '/handball' },
      { slug: 'rugby', name: '🏉 RUGBY', url: '/rugby' },
      { slug: 'cricket', name: '🏏 CRICKET', url: '/cricket' },
      { slug: 'golf', name: '⛳ GOLF', url: '/golf' },
      { slug: 'mma', name: '🥊 MMA', url: '/mma' },
      { slug: 'boxing', name: '🥊 BOXING', url: '/boxing' },
      { slug: 'nfl', name: '🏈 NFL', url: '/nfl' },
      { slug: 'esports', name: '🎮 ESPORTS', url: '/esports' },
    ];
    
    const defaultCategories = [
      { slug: 'world-cup', name: 'FIFA World Cup', url: '/world-cup/', category_type: 'tournament' },
      { slug: 'europe-championship', name: 'UEFA European Championship', url: '/europe-championship/', category_type: 'tournament' },
      { slug: 'premier-league', name: 'England Premier League', url: '/england/premier-league/', category_type: 'league' },
      { slug: 'la-liga', name: 'Spain La Liga', url: '/spain/laliga/', category_type: 'league' },
      { slug: 'bundesliga', name: 'Germany Bundesliga', url: '/germany/bundesliga/', category_type: 'league' },
      { slug: 'serie-a', name: 'Italy Serie A', url: '/italy/serie-a/', category_type: 'league' },
      { slug: 'ligue-1', name: 'France Ligue 1', url: '/france/ligue-1/', category_type: 'league' },
      { slug: 'argentina', name: 'Argentina', url: '/football/argentina/', category_type: 'country' },
      { slug: 'brazil', name: 'Brazil', url: '/football/brazil/', category_type: 'country' },
      { slug: 'champions-league', name: 'Champions League', url: '/europe/champions-league/', category_type: 'tournament' },
    ];
    
    // Parse URL to determine page type and sport
    function getPageConfig() {
      const path = window.location.pathname;
      const pathParts = path.split('/').filter(Boolean);
      
      // /menu → sports list
      if (path === '/menu' || pathParts.length === 1 && pathParts[0] === 'menu') {
        return {
          type: 'sports',
          title: '📋 体育菜单',
          subtitle: '点击分类查看详情',
          apiEndpoint: '/api/menu',
          refreshEndpoint: '/api/menu/refresh',
          progressEndpoint: null,
          linkBase: '/menu/',
          statsPrefix: '分类',
        };
      }
      
      // /menu/:sport → category list (e.g., /menu/football)
      if (pathParts.length === 2 && pathParts[0] === 'menu') {
        const sportSlug = pathParts[1];
        const sportNames = {
          football: '⚽ 足球分类',
          basketball: '🏀 篮球分类',
          tennis: '🎾 网球分类',
          baseball: '⚾ 棒球分类',
        };
        const sportName = sportNames[sportSlug] || `📋 ${sportSlug.toUpperCase()} 分类`;
        
        return {
          type: 'categories',
          title: sportName,
          subtitle: `${sportSlug} 分类详情`,
          apiEndpoint: '/api/football',
          refreshEndpoint: '/api/football/refresh',
          progressEndpoint: '/api/football/progress',
          linkBase: '',
          statsPrefix: '项',
          sportSlug: sportSlug,
        };
      }
      
      // Default to sports list
      return {
        type: 'sports',
        title: '📋 体育菜单',
        subtitle: '点击分类查看详情',
        apiEndpoint: '/api/menu',
        refreshEndpoint: '/api/menu/refresh',
        progressEndpoint: null,
        linkBase: '/menu/',
        statsPrefix: '分类',
      };
    }
    
    // Show toast notification
    function showToast(message, type = 'info') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = `toast ${type} show`;
      setTimeout(() => { toast.className = 'toast'; }, 3000);
    }
    
    // Set loading state
    function setLoading(loading) {
      const btn = document.getElementById('refresh-btn');
      if (loading) {
        btn.classList.add('loading');
        btn.disabled = true;
      } else {
        btn.classList.remove('loading');
        btn.disabled = false;
      }
    }
    
    // Show/hide progress bar
    function showProgress() {
      document.getElementById('progress-container').classList.add('active');
    }
    
    function hideProgress() {
      document.getElementById('progress-container').classList.remove('active');
    }
    
    function updateProgressUI(progress) {
      document.getElementById('progress-percent').textContent = `${progress.percent}%`;
      document.getElementById('progress-fill').style.width = `${progress.percent}%`;
      document.getElementById('progress-operation').textContent = progress.current_operation || progress.stage;
      document.getElementById('processed-count').textContent = progress.processed_items || 0;
      document.getElementById('total-count').textContent = progress.total_items || 0;
      document.getElementById('remaining-count').textContent = 
        Math.max(0, (progress.total_items || 0) - (progress.processed_items || 0));
    }
    
    // Start progress polling
    function startProgressPolling() {
      if (progressPollingInterval) return;
      showProgress();
      refreshProgress.in_progress = true;
      
      progressPollingInterval = setInterval(async () => {
        try {
          const res = await fetch('/api/football/progress');
          const progress = await res.json();
          updateProgressUI(progress);
          
          if (!progress.in_progress) {
            stopProgressPolling();
          }
        } catch (e) {
          console.error('Progress polling error:', e);
        }
      }, 500);
    }
    
    function stopProgressPolling() {
      if (progressPollingInterval) {
        clearInterval(progressPollingInterval);
        progressPollingInterval = null;
      }
      setTimeout(hideProgress, 1000);
    }
    
    // Fetch data from API
    async function fetchData() {
      const config = getPageConfig();
      
      try {
        const response = await fetch(config.apiEndpoint);
        const result = await response.json();
        
        if (result.ok && result.data) {
          // Extract data based on type
          if (config.type === 'sports') {
            data = result.data.sports || [];
          } else {
            data = result.data.categories || [];
          }
          
          // Update last updated time
          if (result.data.last_updated) {
            const date = new Date(result.data.last_updated);
            document.getElementById('last-updated').textContent = '更新: ' + date.toLocaleTimeString();
          }
        } else {
          data = config.type === 'sports' ? defaultSports : defaultCategories;
          if (result.error) {
            showToast(result.error, 'error');
          }
        }
      } catch (e) {
        console.error('Fetch error:', e);
        data = config.type === 'sports' ? defaultSports : defaultCategories;
        showToast('加载默认数据', 'info');
      }
      
      renderPage(1);
    }
    
    // Handle refresh button click
    async function handleRefresh() {
      const config = getPageConfig();
      
      if (!config.refreshEndpoint) {
        showToast('当前页面不支持刷新', 'info');
        return;
      }
      
      setLoading(true);
      
      // Start progress polling for football pages
      if (config.progressEndpoint) {
        startProgressPolling();
      }
      
      try {
        const response = await fetch(config.refreshEndpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
        });
        const result = await response.json();
        
        if (config.progressEndpoint) {
          stopProgressPolling();
        }
        
        if (result.ok && result.data) {
          // Extract data based on type
          if (config.type === 'sports') {
            data = result.data.sports || [];
          } else {
            data = result.data.categories || [];
          }
          
          // Update last updated time
          if (result.data.last_updated) {
            const date = new Date(result.data.last_updated);
            document.getElementById('last-updated').textContent = '更新: ' + date.toLocaleTimeString();
          }
          
          renderPage(1);
          showToast(result.message || '刷新成功！', 'success');
        } else {
          showToast(result.error || '刷新失败', 'error');
        }
      } catch (e) {
        if (config.progressEndpoint) {
          stopProgressPolling();
        }
        showToast('刷新请求失败', 'error');
      } finally {
        setLoading(false);
      }
    }
    
    // Render stats bar
    function renderStats() {
      const config = getPageConfig();
      const statsBar = document.getElementById('stats-bar');
      
      if (config.type === 'categories' && data.length > 0) {
        // Count by type for categories
        const typeCount = {};
        data.forEach(item => {
          typeCount[item.category_type] = (typeCount[item.category_type] || 0) + 1;
        });
        
        statsBar.innerHTML = Object.entries(typeCount)
          .map(([type, count]) => `<span class="stat-badge">${type}: ${count}</span>`)
          .join('') + `<span class="stat-badge">总计: ${data.length}</span>`;
      } else {
        // Simple count for sports
        statsBar.innerHTML = `<span class="stat-badge">总计: ${data.length} ${config.statsPrefix}</span>`;
      }
    }
    
    // Render current page
    function renderPage(page) {
      currentPage = page;
      const config = getPageConfig();
      
      // Update page title and subtitle
      document.getElementById('page-title').textContent = config.title;
      document.getElementById('page-subtitle').textContent = config.subtitle;
      
      // Render stats
      renderStats();
      
      // Calculate pagination
      const totalPages = Math.ceil(data.length / ITEMS_PER_PAGE) || 1;
      const start = (page - 1) * ITEMS_PER_PAGE;
      const end = start + ITEMS_PER_PAGE;
      const pageItems = data.slice(start, end);
      
      // Check empty state
      if (data.length === 0) {
        document.getElementById('content').innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📭</div>
            <p>暂无数据</p>
          </div>
        `;
        document.getElementById('pagination').innerHTML = '';
        return;
      }
      
      // Render table based on type
      if (config.type === 'sports') {
        // Sports list (2 columns: slug, name)
        document.getElementById('content').innerHTML = `
          <div class="list-table">
            <div class="list-header sports-grid">
              <span>标识符</span>
              <span>名称</span>
            </div>
            ${pageItems.map(sport => `
              <a href="${config.linkBase}${sport.slug}" class="list-row sports-grid">
                <span class="slug">${sport.slug}</span>
                <span class="name">${sport.name}</span>
              </a>
            `).join('')}
          </div>
        `;
      } else {
        // Category list (3 columns: type, name, url)
        document.getElementById('content').innerHTML = `
          <div class="list-table">
            <div class="list-header category-grid">
              <span>类型</span>
              <span>名称</span>
              <span>链接</span>
            </div>
            ${pageItems.map(cat => {
              const url = cat.url ? `https://www.oddsportal.com${cat.url}` : '#';
              const urlDisplay = cat.url || '(无链接)';
              return `
                <a href="${url}" target="_blank" class="list-row category-grid">
                  <span class="type ${cat.category_type}">${cat.category_type}</span>
                  <span class="name">${cat.name}</span>
                  <span class="url">${urlDisplay}</span>
                </a>
              `;
            }).join('')}
          </div>
        `;
      }
      
      // Render pagination
      renderPagination(page, totalPages);
    }
    
    // Render pagination controls
    function renderPagination(current, total) {
      if (total <= 1) {
        document.getElementById('pagination').innerHTML = '';
        return;
      }
      
      let html = '';
      
      // Previous button
      html += `<button class="page-btn" onclick="renderPage(${current - 1})" ${current === 1 ? 'disabled' : ''}>上一页</button>`;
      
      // Page numbers
      const maxButtons = 5;
      let startPage = Math.max(1, current - Math.floor(maxButtons / 2));
      let endPage = Math.min(total, startPage + maxButtons - 1);
      
      if (endPage - startPage < maxButtons - 1) {
        startPage = Math.max(1, endPage - maxButtons + 1);
      }
      
      if (startPage > 1) {
        html += `<button class="page-btn" onclick="renderPage(1)">1</button>`;
        if (startPage > 2) {
          html += `<span class="page-info">...</span>`;
        }
      }
      
      for (let i = startPage; i <= endPage; i++) {
        html += `<button class="page-btn ${i === current ? 'active' : ''}" onclick="renderPage(${i})">${i}</button>`;
      }
      
      if (endPage < total) {
        if (endPage < total - 1) {
          html += `<span class="page-info">...</span>`;
        }
        html += `<button class="page-btn" onclick="renderPage(${total})">${total}</button>`;
      }
      
      // Next button
      html += `<button class="page-btn" onclick="renderPage(${current + 1})" ${current === total ? 'disabled' : ''}>下一页</button>`;
      
      document.getElementById('pagination').innerHTML = html;
    }
    
    // Initialize page
    async function init() {
      // Set page title based on URL
      document.title = getPageConfig().title;
      
      // Fetch data
      await fetchData();
    }
    
    // Start
    init();
  </script>
</body>
