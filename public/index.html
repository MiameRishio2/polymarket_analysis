<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Polymarket Analysis</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f5;
      color: #222;
      min-height: 100vh;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem;
    }
    .header {
      text-align: center;
      margin-bottom: 3rem;
    }
    h1 {
      font-size: 2.5rem;
      color: #1a1a1a;
      margin-bottom: 0.5rem;
    }
    .subtitle {
      color: #666;
      font-size: 1rem;
    }
    .nav-card {
      display: block;
      background: #fff;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
      text-decoration: none;
      color: inherit;
      transition: all 0.2s ease;
      border-left: 4px solid transparent;
    }
    .nav-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0,0,0,.1);
    }
    .nav-card.menu { border-left-color: #3b82f6; }
    .nav-card.analysis { border-left-color: #8b5cf6; }
    .nav-card.sqlite { border-left-color: #10b981; }
    .nav-card h2 {
      font-size: 1.3rem;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .nav-card.menu h2 { color: #3b82f6; }
    .nav-card.analysis h2 { color: #8b5cf6; }
    .nav-card.sqlite h2 { color: #10b981; }
    .nav-card p {
      color: #666;
      font-size: 0.9rem;
    }
    .status {
      display: inline-block;
      font-size: 0.75rem;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      background: #e5e7eb;
      color: #6b7280;
      margin-top: 0.5rem;
    }
    .footer {
      text-align: center;
      margin-top: 3rem;
      color: #999;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🏆 Polymarket Analysis</h1>
      <p class="subtitle">体育数据与赔率分析平台</p>
    </div>

    <a href="/menu" class="nav-card menu">
      <h2>📊 体育菜单 <span class="status">menu</span></h2>
      <p>浏览 OddsPortal 体育分类数据，支持足球、篮球、网球等各大体育项目</p>
    </a>

    <a href="/analysis" class="nav-card analysis">
      <h2>📈 数据分析 <span class="status">analysis</span></h2>
      <p>深入分析赔率变化趋势，挖掘市场机会（开发中）</p>
    </a>

    <a href="/sqlite" class="nav-card sqlite">
      <h2>💾 数据管理 <span class="status">sqlite</span></h2>
      <p>查看和管理本地存储的缓存数据（开发中）</p>
    </a>

    <div class="footer">
      <p>前后端分离 · Rust Axum + 静态 HTML</p>
    </div>
  </div>
</body>
</html>
