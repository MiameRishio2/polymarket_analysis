
<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>比赛数据比较 - 南安普顿 vs 雷克瑟姆</title>
	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
	<style>
		body {
			font-family: Arial, sans-serif;
			margin: 20px;
			background-color: #f5f5f5;
		}
		.container {
			max-width: 1200px;
			margin: 0 auto;
			background-color: white;
			padding: 20px;
			border-radius: 8px;
			box-shadow: 0 0 10px rgba(0,0,0,0.1);
		}
		h1 {
			text-align: center;
			color: #333;
		}
		.chart-container {
			position: relative;
			height: 400px;
			margin: 20px 0;
		}
		.info {
			margin: 20px 0;
			padding: 15px;
			background-color: #f0f0f0;
			border-radius: 4px;
		}
		.info p {
			margin: 5px 0;
		}
	</style>
</head>
<body>
	<div class="container">
		<h1>南安普顿 vs 雷克瑟姆</h1>
		<div class="info">
			<p><strong>比赛时间:</strong> 2026-04-08 03:00:00</p>
			<p><strong>Polymarket市场:</strong> 南安普顿 vs 雷克瑟姆</p>
			<p><strong>交易量:</strong> 15000.50</p>
			<p><strong>最新更新:</strong> 2026-04-08 22:40:14</p>
		</div>

		<h2>Polymarket价格趋势</h2>
		<div class="chart-container">
			<canvas id="polyChart"></canvas>
		</div>

		<h2>OddsPortal赔率趋势</h2>
		<div class="chart-container">
			<canvas id="oddsChart"></canvas>
		</div>

		<h2>概率比较</h2>
		<div class="chart-container">
			<canvas id="probChart"></canvas>
		</div>
	</div>

	<script>
		// 准备数据
		const timestamps = [
				"2026-04-08 22:40:14",
		];

		const polyYesData = [
				0.7500,
		];

		const polyNoData = [
				0.2500,
		];

		const oddsHomeData = [
				2.2271,
		];

		const oddsDrawData = [
				3.2565,
		];

		const oddsAwayData = [
				3.2065,
		];

		// 计算概率数据
		const polyHomeProb = polyYesData;
		const polyAwayProb = polyNoData;
		const oddsHomeProb = oddsHomeData.map(odd => 1/odd / (1/odd + 1/oddsDrawData[oddsHomeData.indexOf(odd)] + 1/oddsAwayData[oddsHomeData.indexOf(odd)]));
		const oddsAwayProb = oddsAwayData.map(odd => 1/odd / (1/oddsHomeData[oddsAwayData.indexOf(odd)] + 1/oddsDrawData[oddsAwayData.indexOf(odd)] + 1/odd));

		// 绘制Polymarket价格图表
		const polyCtx = document.getElementById('polyChart').getContext('2d');
		new Chart(polyCtx, {
			type: 'line',
			data: {
				labels: timestamps,
				datasets: [
					{
						label: 'Yes 价格',
						data: polyYesData,
						borderColor: 'rgba(75, 192, 192, 1)',
						backgroundColor: 'rgba(75, 192, 192, 0.2)',
						tension: 0.1
					},
					{
						label: 'No 价格',
						data: polyNoData,
						borderColor: 'rgba(255, 99, 132, 1)',
						backgroundColor: 'rgba(255, 99, 132, 0.2)',
						tension: 0.1
					}
				]
			},
			options: {
				y: {
					beginAtZero: true,
					max: 1
				}
			}
		});

		// 绘制OddsPortal赔率图表
		const oddsCtx = document.getElementById('oddsChart').getContext('2d');
		new Chart(oddsCtx, {
			type: 'line',
			data: {
				labels: timestamps,
				datasets: [
					{
						label: '主胜赔率',
						data: oddsHomeData,
						borderColor: 'rgba(75, 192, 192, 1)',
						backgroundColor: 'rgba(75, 192, 192, 0.2)',
						tension: 0.1
					},
					{
						label: '平局赔率',
						data: oddsDrawData,
						borderColor: 'rgba(54, 162, 235, 1)',
						backgroundColor: 'rgba(54, 162, 235, 0.2)',
						tension: 0.1
					},
					{
						label: '客胜赔率',
						data: oddsAwayData,
						borderColor: 'rgba(255, 99, 132, 1)',
						backgroundColor: 'rgba(255, 99, 132, 0.2)',
						tension: 0.1
					}
				]
			}
		});

		// 绘制概率比较图表
		const probCtx = document.getElementById('probChart').getContext('2d');
		new Chart(probCtx, {
			type: 'line',
			data: {
				labels: timestamps,
				datasets: [
					{
						label: 'Polymarket 主胜概率',
						data: polyHomeProb,
						borderColor: 'rgba(75, 192, 192, 1)',
						backgroundColor: 'rgba(75, 192, 192, 0.2)',
						tension: 0.1
					},
					{
						label: 'OddsPortal 主胜概率',
						data: oddsHomeProb,
						borderColor: 'rgba(54, 162, 235, 1)',
						backgroundColor: 'rgba(54, 162, 235, 0.2)',
						tension: 0.1
					},
					{
						label: 'Polymarket 客胜概率',
						data: polyAwayProb,
						borderColor: 'rgba(255, 99, 132, 1)',
						backgroundColor: 'rgba(255, 99, 132, 0.2)',
						tension: 0.1
					},
					{
						label: 'OddsPortal 客胜概率',
						data: oddsAwayProb,
						borderColor: 'rgba(255, 206, 86, 1)',
						backgroundColor: 'rgba(255, 206, 86, 0.2)',
						tension: 0.1
					}
				]
			},
			options: {
				y: {
					beginAtZero: true,
					max: 1
				}
			}
		});
	</script>
</body>
</html>
